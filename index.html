<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ZEMITA 센서 게임</title><link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#14101a"><meta name="mobile-web-app-capable" content="yes"><link rel="icon" href="icon-192.png">
<style>
:root{--bg:#14101a;--fg:#efeaf3;--mut:#9a92a6;--card:#201a2a;--line:#362d45;--acc:#d6381f}
*{box-sizing:border-box}html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--fg);font-family:"Noto Sans KR",system-ui,sans-serif;display:flex;align-items:center;justify-content:center;padding:16px}
.box{width:100%;max-width:360px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:22px 18px;text-align:center}
.box img{width:72px;height:72px;border-radius:16px}
h1{font-size:20px;margin:10px 0 4px}p{color:var(--mut);font-size:13px;margin:0 0 14px}
input[type=password]{width:100%;font:inherit;font-size:18px;padding:12px;border-radius:10px;border:1px solid var(--line);background:#14101a;color:var(--fg);text-align:center;letter-spacing:2px}
button{width:100%;margin-top:10px;font:inherit;font-weight:800;font-size:16px;padding:12px;border:0;border-radius:10px;background:var(--acc);color:#fff}
label{display:block;margin-top:10px;font-size:13px;color:var(--mut)}#m{min-height:20px;margin-top:10px;font-size:14px;font-weight:700;color:#ff8a8a}
</style></head><body>
<form class="box" id="f" autocomplete="off"><img src="icon-192.png" alt=""><h1>🥋 ZEMITA 센서 게임</h1><p>도장 비밀번호를 넣어 주세요</p>

async function open(pw){var e=new TextEncoder(),base=await crypto.subtle.importKey('raw',e.encode(pw),'PBKDF2',false,['deriveKey']);
 var key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(B.s),iterations:B.it,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt']);
 var gz=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(B.i)},key,b64(B.d));
 var txt=await new Response(new Blob([gz]).stream().pipeThrough(new DecompressionStream('gzip'))).text();return txt}
