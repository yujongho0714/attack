<style>
:root{--bg:#f4f3ee;--fg:#1c1c1a;--mut:#6b6a64;--card:#fff;--bd:#d8d6cc;--ac:#2f6df6;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#17181c;--fg:#ececea;--mut:#9a9a94;--card:#23252b;--bd:#3a3d45;--ac:#6b9bff}}
:root[data-theme=dark]{--bg:#17181c;--fg:#ececea;--mut:#9a9a94;--card:#23252b;--bd:#3a3d45;--ac:#6b9bff}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{height:100%;margin:0;background:var(--bg);color:var(--fg);font:14px/1.4 system-ui,"Noto Sans KR","Apple SD Gothic Neo",sans-serif;display:flex;flex-direction:column;overflow:hidden}
#st{background:#000;display:flex;justify-content:center;flex:none}
canvas{height:min(42dvh,calc(100vw*250/380));aspect-ratio:380/250;max-width:100%;display:block}
.row{display:flex;gap:6px;padding:6px 8px;overflow-x:auto;flex:none;border-bottom:1px solid var(--bd)}
button{font:inherit;color:var(--fg);background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:6px 10px;white-space:nowrap;flex:none}
button.on{border-color:var(--ac);color:var(--ac);font-weight:600}
#pn{flex:1;overflow:auto;padding:8px 10px 14px}
.g{display:grid;grid-template-columns:1fr 1fr;gap:8px 12px}
.s{display:flex;flex-direction:column;font-size:12px;color:var(--mut)}.s b{color:var(--fg);font-weight:600}.s input{width:100%;margin:4px 0 0}
.cr{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 8px}
input[type=color]{width:100%;height:34px;border:1px solid var(--bd);border-radius:8px;padding:0;background:none}
textarea{width:100%;height:120px;box-sizing:border-box;font:12px monospace;background:var(--card);color:var(--fg);border:1px solid var(--bd);border-radius:8px}
#sk{flex:none;border-bottom:1px solid var(--bd);padding:6px 8px}
#sk .hd{display:flex;align-items:center;justify-content:space-between;gap:6px;font-size:12px;color:var(--mut);margin-bottom:5px}
#sk .hd b{color:var(--fg)}
#sk .arw{padding:1px 12px;font-size:15px;line-height:1.3}
.cats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.cat{display:flex;flex-direction:column;align-items:center;gap:0;padding:5px 2px;white-space:normal;font-size:12px;line-height:1.25}
.cat i{font-style:normal;font-size:17px}.cat small{color:var(--mut);font-size:11px}
#q{width:100%;box-sizing:border-box;margin-top:6px;font:inherit;padding:5px 8px;border:1px solid var(--bd);border-radius:8px;background:var(--card);color:var(--fg)}
body.lo canvas{height:min(30dvh,calc(100vw*250/380))}
.ml{overflow:auto;max-height:20dvh;margin-top:4px;-webkit-overflow-scrolling:touch}
#sk.ex .ml{max-height:36dvh}
.ml h5{margin:6px 0 3px;font-size:11px;color:var(--mut);font-weight:600}
.ml h5.ct{font-size:13px;color:var(--fg);position:sticky;top:0;background:var(--bg);padding:3px 0;z-index:1}
.ml .cr{margin:0 0 3px}
.mv{padding:4px 8px;font-size:12px}
.mv .d{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px}

<div id="st"><canvas id="c" width="760" height="500"></canvas></div>
<div id="sk"></div>
<div class="row" id="pr"></div>
<div class="row" id="tb"></div>
<div id="pn"></div>
<script>
const W=380,H=250,D=2,A={x:78,y:185},B={x:300,y:125};
const cv=document.getElementById('c'),cx=cv.getContext('2d');
const off=document.createElement('canvas'),sil=document.createElement('canvas');off.width=sil.width=760;off.height=sil.height=500;
const DEF={type:'stream',shape:'drop',col:'#2f8cff',col2:'#d8f0ff',speed:900,count:1,spread:0,size:24,dur:1.6,rate:12,hits:8,trail:.5,wob:14,arc:0,spin:0,shake:5,out:1,dim:1,lb:1,lite:0,gap:.8,slow:1,eth:1,en:1,esp:1,edur:0};
const PRE={'하이드로펌프':{},'매직클로':{type:'slash',col:'#ff4d6d',col2:'#ffffff',count:3,size:40,hits:3,dur:.5,speed:900},
'불꽃방사':{type:'stream',col:'#ff6a1a',col2:'#ffe08a',size:20,wob:18,dur:1.4,hits:6,speed:800},
'물수리검':{type:'proj',shape:'shuriken',col:'#4cc3ff',col2:'#ffffff',count:3,spread:24,speed:800,rate:3,dur:.6,hits:3,spin:14,size:14,trail:.4,wob:0},
'전기구슬':{type:'proj',shape:'orb',col:'#ffe22e',col2:'#ffffff',count:1,dur:0,hits:1,speed:600,size:18,trail:.8,wob:0,spread:0},
'파동탄':{type:'burst',col:'#b47cff',col2:'#f2e6ff',size:20,hits:3,dur:.6,speed:700}};
let P=Object.assign({},DEF),tab='발사',t0=performance.now(),paused=false,pT=0;
try{const s=localStorage.getItem('fxed');if(s)Object.assign(P,JSON.parse(s))}catch(e){}
const TABS={'발사':[['speed','투사체 속도',150,1800,10],['count','투사체 수(한 번에)',1,12,1],['dur','발사 시간(초)',0,4,.1],['rate','초당 발사 횟수',1,40,1],['spread','부채꼴 각도',0,90,1],['hits','다단히트 수',1,16,1]],
'모양':[['size','크기',4,48,1],['trail','꼬리 길이',0,1,.05],['wob','흔들림 폭',0,40,1],['arc','곡선 높이',0,120,1],['spin','회전 속도',0,30,1]],
'연출':[['shake','타격 흔들림',0,20,1],['gap','반복 간격(초)',0,3,.1],['slow','재생 속도',.1,1.5,.05]]};
const TYPES=[['proj','투사체'],['stream','빔·방사'],['slash','할퀴기'],['burst','폭발']],SHAPES=[['orb','구슬'],['drop','물방울'],['shuriken','수리검'],['bolt','번개']],TOG=[['out','이중테두리'],['dim','배경 어둡게'],['lb','레터박스'],['lite','밝은 배경']];
const $=id=>document.getElementById(id);
const LS=()=>{try{return JSON.parse(localStorage.getItem('pka-fxed')||'{}')}catch(e){return{}}},SV=o=>{try{localStorage.setItem('pka-fxed',JSON.stringify(o))}catch(e){}pub(o)},GM=location.search.includes('game=1');let MSG='';
function st(m){MSG=m;const o=document.getElementById('sx');if(o)o.textContent=m}
function pub(o){if(!GM){st('이 화면은 게임 밖이에요. 아래 fxed.json 복사로 올려 주세요');return}st('서버에 올리는 중…');try{parent.postMessage({t:'fxed-pub',data:o},location.origin)}catch(e){}}
addEventListener('message',e=>{if(e.origin!==location.origin||!e.data)return;if(e.data.t==='fxed-res')st(e.data.m?'⚠ 서버에 올리지 못했어요: '+e.data.m:'✓ 서버에 올렸어요. 모든 아이에게 몇 분 안에 자동 적용돼요');
 else if(e.data.t==='fxed-emp'&&Array.isArray(e.data.list)){for(const x of e.data.list)if(x&&x.k&&x.n)EL[String(x.k)]=String(x.n);try{localStorage.setItem('fxed-names',JSON.stringify(EL))}catch(x){}skDraw();if(P.emp)draw()}});
document.addEventListener('input',e=>{if(e.target.id!=='q')return;QS=e.target.value;const m=$('ml');if(m)m.innerHTML=mlHtml()});
function save(){try{localStorage.setItem('fxed',JSON.stringify(P))}catch(e){}}
function restart(){t0=performance.now();pT=0;save();eMake()}
function chips(list,key){return '<div class="cr">'+list.map(([v,l])=>`<button data-k="${key}" data-v="${v}" class="${P[key]===v?'on':''}">${l}</button>`).join('')+'</div>'}
function sl(d){return d.map(([k,l,a,b,s])=>`<label class="s"><span>${l} <b id="v_${k}">${P[k]}</b></span><input type="range" data-k="${k}" min="${a}" max="${b}" step="${s}" value="${P[k]}"></label>`).join('')}
function draw(){if(P.emp&&(tab==='발사'||tab==='모양'))tab='조절';else if(!P.emp&&tab==='조절')tab='발사';
 $('tb').innerHTML=(P.emp?['조절','연출','저장']:['발사','모양','연출','저장']).map(t=>`<button data-tab="${t}" class="${t===tab?'on':''}">${t}</button>`).join('')+(GM?'<button data-act="cl">닫기</button>':'')+`<button data-act="pp">${paused?'재생':'일시정지'}</button><button data-act="re">다시</button>`;
 $('pr').innerHTML=Object.keys(PRE).map(n=>`<button data-pre="${n}">${n}</button>`).join('')+Object.keys(LS()).map(n=>`<button data-ld="${n}">★${n}</button>`).join('');
 let h='';
 if(tab==='조절')h=emHtml();
 else if(tab==='발사')h='<div class="g">'+sl(TABS['발사'])+'</div>';
 else if(tab==='모양')h=chips(TYPES,'type')+chips(SHAPES,'shape')+'<div class="g">'+sl(TABS['모양'])+`<label class="s"><span>바깥 색</span><input type="color" data-k="col" value="${P.col}"></label><label class="s"><span>안쪽 색</span><input type="color" data-k="col2" value="${P.col2}"></label></div>`;
 else if(tab==='연출')h='<div class="cr">'+TOG.map(([k,l])=>`<button data-t="${k}" class="${P[k]?'on':''}">${l}</button>`).join('')+'</div><div class="g">'+sl(TABS['연출'])+'</div>';
 else h='<div class="cr"><input id="nm" placeholder="이름 (예: 내 하이드로펌프)" style="flex:1;min-width:120px;font:inherit;padding:6px;border:1px solid var(--bd);border-radius:8px;background:var(--card);color:var(--fg)"><button data-act="sv">게임에 저장</button></div><div class="cr">'+(Object.keys(LS()).map(n=>`<button data-ld="${n}">${n}</button><button data-del="${n}">삭제</button>`).join('')||'<span class="s">저장한 이펙트가 없어요</span>')+'</div><div id="sx" class="s" style="margin-bottom:6px">'+(MSG||'게임 안에서 저장하면 서버에 올라가 모든 아이에게 자동 적용돼요. 기술 이펙트 관리자 목록 「🎛 내 이펙트」에서 기술에 고르세요.')+'</div><textarea id="js" spellcheck="false">'+JSON.stringify(P)+'</textarea><div class="cr" style="margin-top:8px"><button data-act="up">서버에 다시 올리기</button><button data-act="ex">fxed.json 내용 복사</button><button data-act="cp">현재 값 복사</button><button data-act="ap">붙여넣기 적용</button></div>';
 $('pn').innerHTML=h}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const d=b.dataset;
 if(d.emp){emPick(d.emp,b)}
 else if(d.cat){CAT=(CAT===d.cat&&!EXP)?null:d.cat;EXP=0;skDraw()}
 else if(d.act==='ar'){EXP=EXP?0:1;skDraw()}
 else if(d.tab){tab=d.tab;draw()}
 else if(d.pre){P=Object.assign({},DEF,PRE[d.pre]);restart();draw();skDraw()}
 else if(d.k){P[d.k]=d.v;restart();draw()}
 else if(d.t){P[d.t]=P[d.t]?0:1;restart();draw()}
 else if(d.ld){P=Object.assign({},DEF,LS()[d.ld]);restart();draw();skDraw()}
 else if(d.del){const s=LS();delete s[d.del];SV(s);draw()}
 else if(d.act==='sv'){const n=($('nm').value||'').replace(/\|/g,'').trim();if(!n){$('nm').placeholder='이름을 먼저 적어 주세요';return}const s=LS();s[n]=Object.assign({},P);SV(s);draw()}
 else if(d.act==='ex'){const t=$('js');t.value=JSON.stringify(LS());t.select();try{navigator.clipboard.writeText(t.value)}catch(x){try{document.execCommand('copy')}catch(y){}}}
 else if(d.act==='up'){pub(LS())}
 else if(d.act==='cl'){try{parent.postMessage({t:'fxed-close'},location.origin)}catch(x){}}
 else if(d.act==='pp'){paused=!paused;if(!paused)t0=performance.now()-pT*1000/P.slow;draw()}
 else if(d.act==='re'){restart()}
 else if(d.act==='cp'){const t=$('js');t.select();try{navigator.clipboard.writeText(t.value)}catch(x){try{document.execCommand('copy')}catch(y){}}}
 else if(d.act==='ap'){try{P=Object.assign({},DEF,JSON.parse($('js').value));restart();draw();skDraw()}catch(x){$('js').value='형식이 맞지 않아요'}}});
document.addEventListener('input',e=>{const k=e.target.dataset.k;if(!k)return;const v=e.target.type==='color'?e.target.value:+e.target.value;P[k]=v;const o=$('v_'+k);if(o)o.textContent=v;restart()});

// ===== Empress 기술 (게임에 있는 기술 이펙트 전부) =====
// 박스 4개로 나눠 두고, 박스를 누르면 그 안의 기술만 보여요 · 오른쪽 위 ▼ 를 누르면 전부 펼쳐져요
let EM=null,EMAP={},EL={},CAT=null,EXP=0,QS='',EFAIL=0,eInst=null,eLast=0,eHits=[],eDone=null,eNow=0;
try{EL=JSON.parse(localStorage.getItem('fxed-names')||'{}')||{}}catch(e){}
const CATS=[['p','🎯','날아가요'],['m','👊','가까이서'],['u','🌊','퍼져요'],['s','✨','제자리']];
const KOT={Normal:'노말',Fire:'불꽃',Water:'물',Electric:'전기',Grass:'풀',Ice:'얼음',Fighting:'격투',Poison:'독',Ground:'땅',Flying:'비행',Psychic:'에스퍼',Bug:'벌레',Rock:'바위',Ghost:'고스트',Dragon:'드래곤',Dark:'악',Steel:'강철',Fairy:'페어리',Stellar:'스텔라'};
const EMS=[['eth','크기 (클수록 커져요)',.3,3,.05],['en','투사체 수',1,8,1],['esp','속도 (클수록 빨라요)',.3,3,.05],['edur','나가는 시간(초) · 0 이면 기술 기본값',0,6,.1]];
const esc=t=>String(t==null?'':t).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const nmId=id=>EL[id]||(EMAP[id]&&EMAP[id].en)||id;
const dotCol=ty=>{const E=window.EMPFX,t=E&&E.TC&&(E.TC[ty]||E.TC.Normal),c=t&&t[0];return /^#[0-9a-f]{3,8}$/i.test(c||'')?c:'#888'};
function emBuild(){const E=window.EMPFX;if(!E||EM||!E.D)return;EM={p:[],m:[],u:[],s:[]};const order=Object.keys(KOT);
 E.D.forEach((m,i)=>{const id=String(m[0]);if(id.charAt(0)==='@')return;let k='p';try{k=E.kindOf(i).k}catch(e){}if(k==='t')k='s';if(!EM[k])k='p';const x={id,ty:m[2],i,en:String(m[1]||id)};EMAP[id]=x;EM[k].push(x)});
 for(const k in EM)EM[k].sort((a,b)=>{const oa=order.indexOf(a.ty),ob=order.indexOf(b.ty);return(oa<0?99:oa)-(ob<0?99:ob)||a.i-b.i})}
function mlHtml(){if(!EM)return '';const q=QS.trim().toLowerCase(),cs=EXP?CATS:CATS.filter(c=>c[0]===CAT);let h='';
 for(const [k,ic,l] of cs){let L=EM[k];if(q)L=L.filter(x=>(nmId(x.id)+' '+x.id+' '+x.en).toLowerCase().includes(q));if(q&&!L.length)continue;
  if(EXP)h+=`<h5 class="ct">${ic} ${l} (${L.length})</h5>`;let last=null,buf='';
  for(const x of L){if(x.ty!==last){if(buf)h+=`<div class="cr">${buf}</div>`;buf='';last=x.ty;h+=`<h5>${esc(KOT[x.ty]||x.ty)}</h5>`}
   buf+=`<button class="mv ${P.emp===x.id?'on':''}" data-emp="${esc(x.id)}"><span class="d" style="background:${dotCol(x.ty)}"></span>${esc(nmId(x.id))}</button>`}
  if(buf)h+=`<div class="cr">${buf}</div>`}
 return h||'<span class="s">찾는 기술이 없어요</span>'}
function selHtml(){return P.emp?' · 선택: <b>'+esc(nmId(P.emp))+'</b>':''}
function skDraw(){const o=$('sk');if(!o)return;
 if(!window.EMPFX||!EM){o.innerHTML='<div class="hd"><span>🎆 Empress 기술</span></div><div class="s">'+(EFAIL?'⚠ empress-fx.js 를 불러오지 못했어요 (poke 폴더에 있어야 해요)':'불러오는 중…')+'</div>';return}
 const tot=Object.keys(EM).reduce((a,k)=>a+EM[k].length,0),open=EXP||CAT;
 o.className=EXP?'ex':'';document.body.classList.toggle('lo',!!open);
 o.innerHTML=`<div class="hd"><span>🎆 Empress 기술 ${tot}개<span id="sel">${selHtml()}</span></span><button class="arw" data-act="ar" title="전체 보기">${EXP?'▲':'▼'}</button></div>`
  +'<div class="cats">'+CATS.map(([k,ic,l])=>`<button class="cat ${CAT===k&&!EXP?'on':''}" data-cat="${k}"><i>${ic}</i>${l}<small>${EM[k].length}개</small></button>`).join('')+'</div>'
  +(open?`<input id="q" placeholder="기술 이름 찾기" value="${esc(QS)}" autocomplete="off"><div class="ml" id="ml">${mlHtml()}</div>`:'')}
function emPick(id,btn){const E=window.EMPFX,x=EMAP[id];if(!x)return;const tc=(E.TC&&(E.TC[x.ty]||E.TC.Normal))||[];
 P=Object.assign({},DEF,{emp:id,eth:1,en:1,esp:1,edur:0,col:/^#[0-9a-f]{6}$/i.test(tc[0]||'')?tc[0]:'#ffffff',col2:/^#[0-9a-f]{6}$/i.test(tc[1]||'')?tc[1]:'#ffffff'});
 tab='조절';restart();draw();document.querySelectorAll('.mv.on').forEach(b=>b.classList.remove('on'));if(btn)btn.classList.add('on');const s=$('sel');if(s)s.innerHTML=selHtml()}
function emHtml(){return `<div class="s" style="margin-bottom:8px">🎆 <b>${esc(nmId(P.emp))}</b> — 게임의 Empress 기술 그대로예요. 크기·개수·속도만 바꾸고 「저장」 탭에서 이름을 적어 저장하면 「🎛 내 이펙트」에 들어가요.</div><div class="g">`+sl(EMS)+'</div>'}
function eMake(){eHits=[];eDone=null;eLast=0;eInst=null;if(!P.emp||!window.EMPFX)return;const th=P.eth||1;
 try{eInst=EMPFX.make({id:P.emp,beast:null,po:'',n:P.en||1,sp:P.esp||1,dur:P.edur||0,sz:th,dist:dist()/(1.1*th),cmap:null,onhit:()=>{eHits.push(eNow)}})}catch(e){console.warn('Empress',e);eInst=null}}
function emStep(T){if(!eInst)return;eNow=T;if(T<eLast)eLast=0;let r=T-eLast,n=0;while(r>1e-4&&n++<8){const dt=Math.min(.05,r);try{eInst.step(dt)}catch(e){try{eInst.fire()}catch(x){}eInst=null;return}r-=dt}eLast=T;if(eInst.done&&eDone==null)eDone=T}
function emDraw(c,T){emStep(T);if(!eInst)return;const ang=Math.atan2(B.y-A.y,B.x-A.x),sc=1.1*(P.eth||1);c.save();c.translate(A.x,A.y);c.rotate(ang);c.scale(sc,sc);try{eInst.draw(c)}catch(e){eInst=null}c.restore()}
function emLoad(){const ready=()=>{emBuild();eMake();skDraw();if(GM)try{parent.postMessage({t:'fxed-ask'},location.origin)}catch(e){}};
 if(window.EMPFX)return ready();const sc=document.createElement('script');sc.src='empress-fx.js';sc.onload=ready;sc.onerror=()=>{EFAIL=1;skDraw()};document.head.appendChild(sc);setTimeout(()=>{if(!window.EMPFX){EFAIL=1;skDraw()}},9000)}
const hash=n=>{const x=Math.sin(n*127.1+311.7)*43758.5453;return x-Math.floor(x)};
const dist=()=>Math.hypot(B.x-A.x,B.y-A.y);
function times(){if(P.emp)return eHits.length?eHits.slice():[.5];const n=Math.max(1,P.hits|0),sp=n>1?Math.max(P.dur,.3):0,f=(P.type==='proj'||P.type==='stream')?dist()/P.speed:.15;return Array.from({length:n},(_,i)=>f+(n>1?i*sp/(n-1):0))}
function total(){if(P.emp)return eDone!=null?eDone+.35:7;const h=times();return Math.max(h[h.length-1],P.dur+dist()/P.speed)+.5}
function at(q,off,sd,ang){const nx=-Math.sin(ang),ny=Math.cos(ang),w=Math.sin(q*14+sd)*P.wob*Math.sin(Math.PI*q),o=off*q+w;return{x:A.x+(B.x-A.x)*q+nx*o,y:A.y+(B.y-A.y)*q+ny*o-P.arc*Math.sin(Math.PI*q)}}
function glow(c,x,y,r,col,a){const g=c.createRadialGradient(x,y,0,x,y,r);g.addColorStop(0,'#fff');g.addColorStop(.3,col);g.addColorStop(1,col+'00');c.globalAlpha=a;c.fillStyle=g;c.beginPath();c.arc(x,y,r,0,7);c.fill()}
function shape(c,p,s,ang,rot){const z=P.size*(.5+.5*s);c.globalAlpha=Math.min(1,s+.15);
 if(P.shape==='orb'){glow(c,p.x,p.y,z*1.6,P.col,1);c.fillStyle=P.col2;c.beginPath();c.arc(p.x,p.y,z*.5,0,7);c.fill()}
 else if(P.shape==='drop'){c.save();c.translate(p.x,p.y);c.rotate(ang);c.fillStyle=P.col;c.beginPath();c.ellipse(0,0,z*1.1,z*.6,0,0,7);c.fill();c.fillStyle=P.col2;c.beginPath();c.ellipse(z*.2,-z*.1,z*.5,z*.25,0,0,7);c.fill();c.restore()}
 else if(P.shape==='shuriken'){c.save();c.translate(p.x,p.y);c.rotate(rot);for(const [r,col] of [[z*1.2,P.col],[z*.55,P.col2]]){c.fillStyle=col;c.beginPath();for(let i=0;i<8;i++){const a=i*Math.PI/4,rr=i%2?r*.35:r;c.lineTo(Math.cos(a)*rr,Math.sin(a)*rr)}c.closePath();c.fill()}c.restore()}
 else{c.save();c.translate(p.x,p.y);c.rotate(ang);for(const [w,col] of [[z*.45,P.col],[z*.18,P.col2]]){c.strokeStyle=col;c.lineWidth=w;c.beginPath();c.moveTo(-z*1.2,0);c.lineTo(-z*.4,-z*.4);c.lineTo(z*.1,z*.35);c.lineTo(z*1.2,0);c.stroke()}c.restore()}c.globalAlpha=1}
function fx(c,T){const d=dist(),ang=Math.atan2(B.y-A.y,B.x-A.x);c.lineCap='round';c.lineJoin='round';
 if(P.type==='proj'){const ne=P.dur>0?Math.max(1,Math.round(P.rate*P.dur)):1;
  for(let e=0;e<ne;e++){const te=ne>1?e*P.dur/(ne-1):0,age=T-te;if(age<0)continue;
   for(let j=0;j<P.count;j++){const sd=e*31+j*7,fa=P.count>1?(j/(P.count-1)-.5)*P.spread*Math.PI/180:0,off=Math.sin(fa)*d,pp=age*P.speed/d;if(pp>1)continue;
    for(let i=Math.round(P.trail*9);i>=0;i--){const q=pp-i*.022;if(q<0)continue;shape(c,at(q,off,sd,ang),i?(1-i/10)*.5:1,ang,age*P.spin+sd)}}}}
 else if(P.type==='stream'){const head=Math.min(1,T*P.speed/d),tail=T<=P.dur?0:Math.min(1,(T-P.dur)*P.speed/d);
  if(head>tail){const n=28,pts=[];for(let i=0;i<=n;i++){const q=tail+(head-tail)*i/n,p=at(q,0,0,ang),nx=-Math.sin(ang),ny=Math.cos(ang),w=Math.sin(q*d*.05-T*22)*P.wob*.5*(.35+.65*Math.sin(Math.PI*q));pts.push({x:p.x+nx*w,y:p.y+ny*w})}
   for(const [w,col] of [[P.size,P.col],[P.size*.45,P.col2]]){c.strokeStyle=col;c.lineWidth=w;c.beginPath();pts.forEach((p,i)=>i?c.lineTo(p.x,p.y):c.moveTo(p.x,p.y));c.stroke()}
   for(let i=0;i<16;i++){const f=(i/16+T*2.7)%1,q=tail+(head-tail)*f,p=at(q,0,0,ang),o=(hash(i)-.5)*P.size*2.2;c.fillStyle=i%2?P.col2:P.col;c.beginPath();c.arc(p.x-Math.sin(ang)*o,p.y+Math.cos(ang)*o,P.size*.2,0,7);c.fill()}}}
 const ht=times();
 ht.forEach((th,i)=>{const age=T-th;if(age<0||age>.5)return;const fin=i===ht.length-1,fa=1-age/.5;
  for(let k=0;k<(fin?12:7);k++){const a=hash(i*9+k)*6.283,r=age*(160+hash(k+i)*140);c.globalAlpha=fa;c.fillStyle=k%2?P.col2:P.col;c.beginPath();c.arc(B.x+Math.cos(a)*r,B.y+Math.sin(a)*r*.7,P.size*.2*fa+1,0,7);c.fill()}
  if(P.type==='slash'){const u=Math.min(1,age/.1),fl=i%2?-1:1;for(let s=0;s<P.count;s++){const ox=(s-(P.count-1)/2)*P.size*.55*fl,x0=B.x+ox-fl*P.size*.8,y0=B.y-P.size*1.1,x1=B.x+ox+fl*P.size*.8,y1=B.y+P.size*1.1;c.globalAlpha=Math.min(1,fa*1.4);for(const [w,col] of [[P.size*.3,P.col],[P.size*.12,P.col2]]){c.strokeStyle=col;c.lineWidth=w*(1-age);c.beginPath();c.moveTo(x0,y0);c.lineTo(x0+(x1-x0)*u,y0+(y1-y0)*u);c.stroke()}}}
  if(P.type==='burst'){c.globalAlpha=fa;c.strokeStyle=P.col;c.lineWidth=P.size*.4*fa+1;c.beginPath();c.arc(B.x,B.y,age*P.size*9+4,0,7);c.stroke();glow(c,B.x,B.y,P.size*(fin?3:2)*fa+4,P.col,fa)}
  c.globalAlpha=1})}
function ring(c,v,col){if(v<0||v>1)return;const r=14+v*80,a=1-v;c.save();c.beginPath();c.ellipse(B.x,B.y+14,r,r*.6,0,0,7);c.globalAlpha=a*.85;c.strokeStyle='#0a0c1c';c.lineWidth=11;c.stroke();c.globalAlpha=a;c.strokeStyle=col;c.lineWidth=6;c.stroke();c.strokeStyle='#fff';c.lineWidth=2;c.stroke();c.restore()}
function mon(c,p,col,r,dx,wh){c.fillStyle='rgba(0,0,0,.28)';c.beginPath();c.ellipse(p.x,p.y+r*.9,r,r*.3,0,0,7);c.fill();const x=p.x+dx;c.fillStyle=wh?'#fff':col;c.beginPath();c.arc(x,p.y,r,0,7);c.fill();if(!wh){c.fillStyle='#fff';c.beginPath();c.arc(x+r*.3,p.y-r*.2,r*.22,0,7);c.fill();c.fillStyle='#222';c.beginPath();c.arc(x+r*.36,p.y-r*.2,r*.1,0,7);c.fill()}}
function render(T,tot){const c=cx,ht=times();c.setTransform(D,0,0,D,0,0);c.clearRect(0,0,W,H);
 let sh=0,rc=0,hit=0;ht.forEach((th,i)=>{const a=T-th;if(a>=0){hit=i+1;if(a<.25)sh+=P.shake*(1-a/.25);if(a<.12)rc+=(i===ht.length-1?10:5)*(1-a/.12)}});

 if(P.lite){c.fillStyle='#bfe6ff';c.fillRect(0,0,W,H*.5);c.fillStyle='#9ad86a';c.fillRect(0,H*.5,W,H*.5)}else{c.fillStyle='#10131f';c.fillRect(0,0,W,H);c.fillStyle='#181c2e';c.fillRect(0,H*.5,W,H*.5);c.strokeStyle='#ffffff10';for(let x=0;x<W;x+=38){c.beginPath();c.moveTo(x,H*.5);c.lineTo(x*1.4-W*.2,H);c.stroke()}}
 const f=Math.max(0,Math.min(1,T*6,(tot-T)/.25));
 if(f>0&&P.dim){c.fillStyle='rgba(6,8,18,'+.42*f+')';c.fillRect(-10,-10,W+20,H+20);const g=c.createRadialGradient(W/2,H*.45,60,W/2,H*.45,260);g.addColorStop(0,'rgba(0,0,0,0)');g.addColorStop(1,'rgba(0,0,0,'+.55*f+')');c.fillStyle=g;c.fillRect(-10,-10,W+20,H+20)}
 if(f>0&&P.lb){const h=Math.round(H*.05*f);c.fillStyle='#000';c.fillRect(-10,-10,W+20,h+10);c.fillRect(-10,H-h,W+20,h+10)}
 mon(c,A,'#5aa0ff',32,0,0);mon(c,B,'#ff6f8e',36,rc,rc>6);
 if(P.emp){emDraw(c,T)}
 else if(P.out){const o=off.getContext('2d'),s=sil.getContext('2d');o.setTransform(1,0,0,1,0,0);o.clearRect(0,0,760,500);o.setTransform(D,0,0,D,0,0);o.globalCompositeOperation='lighter';fx(o,T);o.globalCompositeOperation='source-over';
  c.save();c.setTransform(1,0,0,1,0,0);const rg=(col,r,n,al)=>{s.setTransform(1,0,0,1,0,0);s.globalCompositeOperation='copy';s.drawImage(off,0,0);s.globalCompositeOperation='source-in';s.fillStyle=col;s.fillRect(0,0,760,500);c.globalAlpha=al;for(let i=0;i<n;i++){const a=i/n*6.2832;c.drawImage(sil,Math.cos(a)*r,Math.sin(a)*r)}};
  rg('#080a18',6.4,8,.9);rg(P.col,3.2,6,.95);c.globalAlpha=1;c.drawImage(off,0,0);c.globalCompositeOperation='lighter';c.globalAlpha=.55;c.drawImage(off,0,0);c.restore()}
 else{c.save();c.globalCompositeOperation='lighter';fx(c,T);c.restore()}
 if(P.out&&!P.emp){const th=ht[ht.length-1];ring(c,(T-th)/.6,P.col);ht.forEach((h,i)=>{const a=T-h;if(a>=0&&a<.12){c.globalAlpha=(i===ht.length-1?.35:.12)*(1-a/.12);c.fillStyle='#fff';c.fillRect(-10,-10,W+20,H+20);c.globalAlpha=1}})}
 c.restore();
 const hp=Math.max(0,1-.7*hit/ht.length);c.fillStyle='#0008';c.fillRect(W-146,10,136,24);c.fillStyle='#333';c.fillRect(W-140,24,124,6);c.fillStyle=hp>.4?'#5ee08a':'#ff6a5a';c.fillRect(W-140,24,124*hp,6);c.fillStyle='#fff';c.font='11px system-ui';c.fillText(hit+' / '+ht.length+' 히트',W-140,19);
 c.fillStyle='#fff9';c.fillText(T.toFixed(2)+'초 / '+tot.toFixed(2)+'초',8,H-8)}
function frame(now){const tot=total(),cyc=tot+P.gap;let T=paused?pT:(now-t0)/1000*P.slow;if(T>cyc){t0=now;T=0;eMake()}pT=T;render(Math.min(T,tot),tot);requestAnimationFrame(frame)}
draw();skDraw();emLoad();requestAnimationFrame(frame);
