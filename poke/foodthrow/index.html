<script>
'use strict';
/* =====================================================================
   1. 소리 (칩튠)
   ===================================================================== */
class SoundEngine{
  constructor(){this.ctx=null;this.muted=false}
  init(){if(!this.ctx)this.ctx=new(window.AudioContext||window.webkitAudioContext)();if(this.ctx.state==='suspended')this.ctx.resume()}
  play(f,type='sine',dur=.1,vol=.12,ef=null){if(this.muted||!this.ctx)return;const o=this.ctx.createOscillator(),g=this.ctx.createGain(),t=this.ctx.currentTime;o.type=type;o.frequency.setValueAtTime(f,t);if(ef)o.frequency.exponentialRampToValueAtTime(ef,t+dur);g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.001,t+dur);o.connect(g);g.connect(this.ctx.destination);o.start();o.stop(t+dur)}
  seq(a,type='triangle',gap=65,d=.15){a.forEach((f,i)=>setTimeout(()=>this.play(f,type,d,.13),i*gap))}
  pullup(){this.play(340+Math.random()*120,'triangle',.09,.1,580)}
  levelUp(){this.seq([523,659,784,1047])}
  perfect(){this.seq([784,1047,1319,1568],'sine',50)}
  whoosh(){this.play(640,'sawtooth',.3,.09,160)}
  gate(){this.seq([880,1175],'square',60,.09)}
  munch(){this.play(210+Math.random()*70,'square',.06,.06,110)}
  capture(){this.seq([523,659,784,1047,1319],'sine',75,.2)}
  coin(){this.play(988,'sine',.08,.12);setTimeout(()=>this.play(1319,'sine',.16,.12),70)}
}
const sfx=new SoundEngine();

/* =====================================================================
   2. 데이터 — 음식 10 · 철봉 10 · 울타리 10 · 구역 10 · 포켓몬 30
   ===================================================================== */
const RAR={
  '일반':{c:'#9aa6bd'},'고급':{c:'#4ade80'},'희귀':{c:'#38bdf8'},'영웅':{c:'#c084fc'},
  '전설':{c:'#facc15'},'신화':{c:'#fb7185'},'코스믹':{c:'#818cf8'},'디바인':{c:'#fff3b0'}
};
const FOODS=[
  {name:'싱싱 블루베리',rar:'일반',luck:1.0,pm:1.0,cost:0,trail:'pj_comet',col:0x60a5fa},
  {name:'체리 컵케이크',rar:'일반',luck:1.4,pm:1.25,cost:120,trail:'pj_comet',col:0xf9a8d4},
  {name:'티본 스테이크',rar:'고급',luck:2.0,pm:1.6,cost:700,trail:'pj_rings',col:0xd97706},

  await Promise.all(['walk','idle'].map(async st=>{const A=meta.anims[st];if(A)img[st]=await loadImg(b+A.f+'-Anim.png')}));return{meta,img}})().catch(()=>null)}
function mkPoke(key,size,mut){
  const m=new THREE.SpriteMaterial({transparent:true,alphaTest:.1,color:mut?MUTS[mut].tint:0xffffff});const s=new THREE.Sprite(m);s.center.set(.5,.14);s.renderOrder=2;s.visible=false;
  const o={s,key,size:size||1,st:'idle',t:Math.random()*5,mut:mut||0,vx:0,vz:0,ready:false,tex:{}};
  pkLoad(key).then(P=>{if(!P)return;o.P=P;for(const st in P.img){if(!P.img[st])continue;const t=texOf(P.img[st]);const A=P.meta.anims[st];const H=P.img[st].height;t.repeat.set(1/A.n,A.h/H);o.tex[st]={t,A,rows:Math.max(1,Math.round(H/A.h)),H}}o.ready=true;s.visible=true;pokeTick(o,0,0,0)});
  return o}
function pokeDir(vx,vz){ // 카메라 기준 8방향 → PMD 줄 번호
  const f=new THREE.Vector3();camera.getWorldDirection(f);f.y=0;f.normalize();const r=new THREE.Vector3(-f.z,0,f.x);
  const sx=vx*r.x+vz*r.z,sd=-(vx*f.x+vz*f.z);const a=Math.atan2(sx,sd);return((Math.round(a/(Math.PI/4))%8)+8)%8}
let PKDIR_CACHE=0;
function pokeTick(o,dt,vx,vz,now){
  if(!o.ready)return;const mv=Math.hypot(vx,vz)>.01;const st=(mv||!o.tex.idle)&&o.tex.walk?'walk':'idle';const T=o.tex[st];if(!T)return;
  if(o.s.material.map!==T.t){o.s.material.map=T.t;o.s.material.needsUpdate=true}
  if(mv)o.row=pokeDir(vx,vz);o.t+=dt*(mv?1.4:1);
  const tot=T.A.d.reduce((a,b)=>a+b,0)/60;let tt=o.t%tot,fi=0;for(;fi<T.A.d.length;fi++){tt-=T.A.d[fi]/60;if(tt<0)break}fi=Math.min(fi,T.A.n-1);
  const row=T.rows>1?(o.row||0):0;T.t.offset.set(fi/T.A.n,1-(row+1)*T.A.h/T.H);
  const k=.085*o.size;o.s.scale.set(T.A.w*k,T.A.h*k,1);
  if(o.mut===3)o.s.material.color.setHSL(((now||0)/2000)%1,.6,.82);
}

const FX=[];
function fxPlay(name,pos,h,o={}){
  const img=IMG[name];if(!img)return null;const n=STRIPN(name);const t=texOf(img,false);t.repeat.set(1/n,1);
  const m=new THREE.SpriteMaterial({map:t,transparent:true,depthWrite:false,depthTest:o.dt!==false,blending:o.add?THREE.AdditiveBlending:THREE.NormalBlending});
  const s=new THREE.Sprite(m);s.center.set(.5,o.cy==null?.5:o.cy);s.scale.set(h*(img.width/n)/img.height,h,1);s.position.copy(pos);s.renderOrder=o.ro||4;if(o.rot)m.rotation=o.rot;scene.add(s);
  const f={s,t,n,fps:o.fps||12,loop:!!o.loop,age:0,life:o.life||(n/(o.fps||12)),fade:o.fade!==false,vy:o.vy||0};FX.push(f);return f}
function fxTick(dt){for(let i=FX.length-1;i>=0;i--){const f=FX[i];f.age+=dt;const fr=Math.floor(f.age*f.fps);
  if(!f.manual)f.t.offset.x=(f.loop?fr%f.n:Math.min(f.n-1,fr))/f.n;f.s.position.y+=f.vy*dt;
  if(f.fade&&!f.loop)f.s.material.opacity=Math.max(0,1-Math.max(0,f.age-f.life*.6)/(f.life*.4));
  if(f.age>=f.life){scene.remove(f.s);f.t.dispose();f.s.material.dispose();FX.splice(i,1)}}}
function fxKill(f){if(!f)return;const i=FX.indexOf(f);if(i>=0){scene.remove(f.s);FX.splice(i,1)}}

function fmt(n){n=+n||0;if(n>=1e12)return(n/1e12).toFixed(2)+'조';if(n>=1e8)return(n/1e8).toFixed(2)+'억';if(n>=1e4)return(n/1e4).toFixed(1)+'만';return Math.floor(n).toLocaleString()}
function toast(t,c='#ffe16b'){const e=document.createElement('div');e.className='toast sh';e.style.color=c;e.textContent=t;const L=document.getElementById('toasts');L.appendChild(e);while(L.children.length>3)L.firstChild.remove();setTimeout(()=>e.remove(),1500)}
const rebMult=()=>1+save.reb;
const dexMult=()=>1+save.dex.length*.1;
function comp(){let e=1,p=1,l=1,n=0;save.mons.forEach(a=>{if(!a.eq)return;const s=SP[a.sp];n++;const v=s.bv*(1+a.mu*.25);if(s.buff==='EXP')e+=v;else if(s.buff==='POWER')p+=v;else l+=v});return{n,e,p,l}}
function totalLuck(){return FOODS[save.food].luck*comp().l*(save.ev>0?3:1)*(1+save.reb*.25)}
function monInc(a){return SP[a.sp].inc*MUTS[a.mu].mult}
function gps(){let s=0;save.mons.forEach(a=>s+=monInc(a));return Math.round(s*penMult(save.pen)*rebMult()*dexMult()*(save.ev>0?2:1))}
const $=id=>document.getElementById(id);
const KO={};
function nm(id){return KO[id]||id}

  $('hCash').textContent=fmt(save.cash);$('hGps').textContent='+'+fmt(gps())+'/초';$('hPow').textContent=fmt(save.power);$('hLuck').textContent=totalLuck().toFixed(1)+'x';
  const f=FOODS[save.food],c=comp();

  $('eqTxt').innerHTML=`<b style="color:${RAR[f.rar].c}">${f.name}</b> · 행운 ${totalLuck().toFixed(1)}x<br><span style="color:#9fe8b8">함께하는 포켓몬 ${c.n}/3 · 힘 x${c.p.toFixed(2)} · 경험치 x${c.e.toFixed(2)}</span>`;
  $('hPen').textContent=save.mons.length+'/'+save.cap;$('tCollect').textContent='수금 +'+fmt(save.store);
  const ev=$('evpill');if(save.ev>0){ev.textContent='이벤트 중 '+Math.ceil(save.ev)+'초 · 행운 3배 · 수익 2배';ev.classList.remove('hide')}else ev.classList.add('hide');
  $('pLv').textContent='레벨 '+save.level;$('pExp').textContent=fmt(save.exp)+' / '+fmt(save.maxExp);$('pullExp').firstChild.style.width=Math.min(100,save.exp/save.maxExp*100)+'%';
  $('tThrow').textContent=state.mode==='GAUGE'?'멈춰서 던지기!':(state.mode==='FLYING'||state.mode==='EATING')?'날아가는 중…':'던지기 [Space]';

const BAR_POS={x:-9,z:4};
function startPull(){if(!state.started||state.mode==='FLYING'||state.mode==='EATING')return;state.mode='PULLING';$('pull').classList.remove('hide');$('gauge').classList.add('hide');doPull()}
function stopPull(){if(state.mode!=='PULLING')return;state.mode='ROAM';player.pos.set(BAR_POS.x,0,BAR_POS.z+3.4);$('pull').classList.add('hide');updateHUD()}
function doPull(){
  const b=BARS[save.bar],c=comp();const pg=Math.max(1,Math.round(b.pg*(1+save.level*.05)*rebMult()*c.p)),eg=Math.max(1,Math.round(b.eg*b.em*c.e));
  save.power+=pg;save.exp+=eg;sfx.pullup();
  if(save.exp>=save.maxExp){save.exp-=save.maxExp;save.level++;save.maxExp=Math.round(save.maxExp*1.45);save.power+=pg*3;sfx.levelUp();toast('레벨 업! Lv.'+save.level+'  힘 +'+fmt(pg*3),'#ffe16b');
    fxPlay('fa_burst',new THREE.Vector3(BAR_POS.x,1,BAR_POS.z+.5),6,{fps:10})}
  else toast('힘 +'+fmt(pg)+'   경험치 +'+fmt(eg),'#8fd0ff');
  persist();updateHUD()}
function onThrow(){
  if(!state.started)return;
  if(state.mode==='ROAM'||state.mode==='PULLING'){stopPull();state.mode='GAUGE';state.gv=.1;state.gd=1;player.pos.set(0,0,-14.5);$('gauge').classList.remove('hide');updateHUD();return}
  if(state.mode!=='GAUGE')return;
  $('gauge').classList.add('hide');const v=state.gv;let mult=.85,lb=1;
  if(v>=.8){mult=1.35;lb=2;sfx.perfect();toast('완벽해요!  힘 +20%  행운 2배','#3ee08a')}
  else if(v>=.55){mult=1.15;lb=1.35;sfx.pullup();toast('좋아요!','#ffe16b')}
  else{sfx.whoosh();toast('아쉬워요','#ff9aa6')}
  const f=FOODS[save.food];const dist=Math.min(MAXD-6,Math.round(35+Math.pow(save.power,.68)*f.pm*mult*3.2));
  const target=Z0-dist;
  const base=+(totalLuck()*lb).toFixed(2);let gm=1;GATES.forEach(g=>{if(g.z>target&&g.z<Z0+.1)gm*=g.mult});
  state.atk=.36;
  foodSpr.material.map=texOf(IMG['food_'+save.food]);foodSpr.material.needsUpdate=true;foodSpr.visible=true;foodSpr.position.set(0,3,-16);
  state.mode='FLYING';state.fl={p:0,dur:Math.min(5.2,1.6+dist/170),sz:-16,tz:target,dist,base,luck:base,final:+(base*gm).toFixed(2),food:f,passed:0,trailT:0};
  $('flight').classList.remove('hide');sfx.whoosh();updateHUD()}
function rollMut(l){const L=MUTS.map((m,i)=>({m,w:i?m.w*(1+Math.log10(Math.max(1,l))):m.w}));const T=L.reduce((s,v)=>s+v.w,0);let r=Math.random()*T;for(const it of L){if(r<it.w)return it.m.r;r-=it.w}return 0}
function biomeAt(z){return BIOMES.find(b=>z<=b.zStart&&z>b.zEnd)||(z>Z0?BIOMES[0]:BIOMES[BIOMES.length-1])}
let bowlFx=null;
function land(z,luck){
  $('flight').classList.add('hide');const b=biomeAt(z);
  const boss=Math.min(.25,.01+luck*.004),rare=Math.min(.6,.2+luck*.012);const r=Math.random();const sp=b.mons[r<boss?2:r<boss+rare?1:0][0];const mu=rollMut(luck);
  foodSpr.visible=false;
  bowlFx=fxPlay('feed_bowl',new THREE.Vector3(0,0,z),4.6,{cy:.05,fps:0,loop:true,life:999,fade:false,ro:3});bowlFx.manual=1;
  fxPlay(/산호|강/.test(b.name)?'fa_splash':'fa_ring',new THREE.Vector3(0,.5,z),7,{fps:9});
  const s=SP[sp];const big=1.6+s.tier*.45;const P=mkPoke(sp,big,mu);P.s.position.set(0,0,z-16);scene.add(P.s);
  state.mode='EATING';state.enc={z,sp,mu,b,P,eat:0,walk:true};
  $('eatName').innerHTML=(mu?`<span class="mut" style="background:${MUTS[mu].c}">${MUTS[mu].name}</span>`:'')+nm(sp)+` <span style="font-size:12px;color:${RAR[s.rar].c}">${s.rar}</span>`;
  $('eatInc').textContent='+'+fmt(s.inc*MUTS[mu].mult)+'/초'+(mu?'  (x'+MUTS[mu].mult+')':'');
  $('eatBar').innerHTML='<b></b>'.repeat(8);$('eat').classList.remove('hide');
  try{pkLandFx(s,mu,z)}catch(e){}
}
function capture(){
  const E=state.enc;try{pkCapFx()}catch(e){}
  $('eat').classList.add('hide');fxKill(bowlFx);bowlFx=null;
  fxPlay('fa_crown',new THREE.Vector3(0,3,E.z),7,{fps:8});fxPlay('fa_firework',new THREE.Vector3(0,5,E.z-1),9,{fps:8});
  scene.remove(E.P.s);
  if(!save.dex.includes(E.sp)){save.dex.push(E.sp);toast('도감 등록 '+save.dex.length+'/'+ALLSP.length+'  수익 +10%','#8fd0ff')}
  if(save.mons.length<save.cap){const n=save.mons.filter(a=>a.eq).length;save.mons.push({u:Math.random().toString(36).slice(2),sp:E.sp,mu:E.mu,eq:n<3});syncRanch();sfx.capture();toast(nm(E.sp)+' 이(가) 목장에 왔어요!','#7cf0a4')}
  else{const v=Math.round(SP[E.sp].inc*MUTS[E.mu].mult*15*rebMult());save.cash+=v;sfx.coin();toast('목장이 꽉 차서 판매  +'+fmt(v),'#ffe16b')}
  try{if(window.parent!==window)parent.postMessage({src:'foodthrow',type:'catch',key:E.sp,mu:E.mu},location.origin)}catch(e){}

  var ready=!!window.EMPFX,LIST=[];if(!ready){var sc=document.createElement('script');sc.src='../empress-fx.js';sc.onload=function(){ready=true};document.head.appendChild(sc)}
  var FOODFX=['energyball','ember','flamethrower','thunderbolt','aurasphere','flamethrower','bubblebeam','sludgebomb','thunderbolt','dazzlinggleam'];
  function fire(id,from,to,size){if(!window.EMPFX)return;var dx=to.x-from.x,dy=to.y-from.y,d=Math.max(60,Math.hypot(dx,dy)),sz=Math.max(.6,Math.min(2.2,size||1));
    try{var inst=EMPFX.make({id:id,beast:null,po:'',n:1,sp:1,dur:0,sz:sz,dist:d/sz,cmap:null,onhit:function(){}});LIST.push({inst:inst,x:from.x,y:from.y,ang:Math.atan2(dy,dx),sc:sz,t:0})}catch(e){}}
  function scr(v){var p=v.clone().project(camera);return{x:(p.x+1)/2*W,y:(1-p.y)/2*H}}
  window.pkLandFx=function(s,mu,z){if(!ready)return;var id=FOODFX[Math.min(FOODFX.length-1,save.food|0)]||'energyball';var to=scr(new THREE.Vector3(0,2,z-14));if(!isFinite(to.x)||!isFinite(to.y))to={x:W*.5,y:H*.42};fire(id,{x:W*.5,y:H*.78},to,s&&s.tier?1.5:1.1)};
  window.pkCapFx=function(){if(!ready)return;fire('dazzlinggleam',{x:W*.5,y:H*.72},{x:W*.5,y:H*.42},1.3)};
  var last=performance.now();(function loop(n){var dt=Math.min(.05,(n-last)/1000);last=n;g.setTransform(dpr,0,0,dpr,0,0);g.clearRect(0,0,W,H);
    for(var i=LIST.length-1;i>=0;i--){var f=LIST[i];f.t+=dt;try{f.inst.step(dt)}catch(e){f.inst.done=true}g.save();g.translate(f.x,f.y);g.rotate(f.ang);g.scale(f.sc,f.sc);try{f.inst.draw(g)}catch(e){f.inst.done=true}g.restore();if(f.inst.done||f.t>5)LIST.splice(i,1)}
    requestAnimationFrame(loop)})(last);
})();
</script>
