<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>계란훔치기</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;touch-action:manipulation;user-select:none}
body{margin:0;background:#12161c;color:#eee;font:13px system-ui,sans-serif;display:flex;justify-content:center}
#app{width:100%;max-width:660px;padding:6px}
#hud{display:flex;gap:4px 10px;flex-wrap:wrap;align-items:center;font-size:12px;margin-bottom:4px}

</style></head><body><div id="app">
<div id="hud"></div>
<div id="wrap"><canvas id="c" width="640" height="420"></canvas><div id="sh" hidden></div></div>
<div id="msg">알을 훔쳐서 왼쪽 기지의 펜에 가져가요! 러닝머신으로 속도를 올려야 먼 곳까지 갈 수 있어요.</div>
<div id="pad"><div class="dp"><span></span><button data-d="u">▲</button><span></span><button data-d="l">◀</button><span></span><button data-d="r">▶</button><span></span><button data-d="d">▼</button><span></span></div>
<div class="ac"><button id="bShop">🏪 상점</button><button id="bBat">🏏 방망이</button><button id="bTrap">🪤 곰덫</button><button id="ex" hidden>나가기</button></div></div>
</div>
<script>
const $=i=>document.getElementById(i),cv=$('c'),x=cv.getContext('2d'),R=Math.random,r=n=>Math.floor(R()*n),FR=parent!==window;
const W=4430,H=420,CW=640,BX=380,BW=450;
// 바이옴: 이름 · 필요 속도(원작 권장 속도) · 색
const BM=[['숲',0,'#3f7a3a'],['호수',900,'#2f6f9f'],['사막',1e4,'#c9a24a'],['정글',4e4,'#1f6a3a'],['눈',17e4,'#cfe3f0'],['화산',7e5,'#7a2a1a'],['심해',2.5e6,'#143a6a'],['선사시대',1.7e7,'#6a5a3a'],['우주',7e8,'#2a1a4a']];
const TN=['일반','희귀','영웅','전설','신화'],TC=['#e8e4d8','#bfe0ff','#e6c8ff','#ffe08a','#ffb0c0'],IB=[1,3,9,30,100],HT=[40,90,180,360,720],MUN={1:'',2:'골드 ',4:'무지개 ',8:'글리치 '};
// 트레일: [이름, 가격, 속도 배율, 색] — 원작처럼 일반~신성 10종, 장착하면 속도 배율이 붙어요
const TRL=[['일반',200,1.1,'#cfd8dc'],['고급',1e3,1.2,'#7be27b'],['희귀',5e3,1.35,'#5ab4ff'],['영웅',2.5e4,1.5,'#c58cff'],['전설',1.2e5,1.75,'#ffd54a'],['신화',6e5,2,'#ff7ab8'],['영원',3e6,2.5,'#ff8a3d'],['시크릿',1.5e7,3,'#3dffd9'],['신성',8e7,4,'#fff6a8'],['무지개',4e8,5,'rb']];
const es=()=>S0.s*(S0.trq>=0?TRL[S0.trq][2]:1),TP=[];
const fmt=n=>n>=1e9?(n/1e9).toFixed(1)+'B':n>=1e6?(n/1e6).toFixed(1)+'M':n>=1e3?(n/1e3).toFixed(1)+'K':Math.floor(n);
let S0={c:30,s:0,tl:0,pc:5,bat:0,tr:2,eg:[],pets:[],trl:[],trq:-1,t:Date.now()};
try{Object.assign(S0,JSON.parse(localStorage.getItem('eggthief2')||'{}'))}catch(e){}
const sv=()=>{S0.t=Date.now();try{localStorage.setItem('eggthief2',JSON.stringify(S0))}catch(e){}};
const inc=p=>IB[p.t]*p.sz*p.mu,best=()=>S0.pets.slice().sort((a,b)=>inc(b)-inc(a)).slice(0,S0.pc),income=()=>best().reduce((a,p)=>a+inc(p),0);
const gain=()=>6*Math.pow(1.6,S0.tl),tlCost=()=>Math.floor(40*Math.pow(2.1,S0.tl)),pcCost=()=>Math.floor(150*Math.pow(3,S0.pc-5));
const htOf=e=>HT[e.t]*Math.sqrt(e.sz);
// 오프라인 수입 (최대 1시간)
S0.c+=income()*Math.min(3600,(Date.now()-S0.t)/1000);
// ---- 포켓몬 그림 (rz) ----
const BASE='../';let DEX=null,KEYS=[],TIERS=[[],[],[],[],[]],SPR={};
const tierOf=b=>b>=680?4:b>=600?3:b>=500?2:b>=400?1:0;
async function loadData(){try{DEX=await (await fetch(BASE+'rzdex.json')).json();const MP=await (await fetch(BASE+'rzmap.json')).json(),NC={};
 // 디지몬·듀엘리스트 신캐: 본편 규칙대로 「출시 주가 지난 것」만 (ncsched.json 의 order[등급][순서] < 이번 주차)
 try{const L=await (await fetch(BASE+'newchars.json')).json(),SC=await (await fetch(BASE+'ncsched.json')).json(),m=/^(\d+)-(\d+)-(\d+)/.exec(SC.start||''),wk=m?Math.floor((Date.now()-new Date(+m[1],+m[2]-1,+m[3]).getTime())/6048e5):-1,IX={};
  for(const g in SC.order)SC.order[g].forEach((d,i)=>IX[d]=i);L.forEach(c=>{if(IX[c.dex]!=null&&IX[c.dex]<wk)NC[c.key]=Math.min(4,c.rar|0)})}catch(e){}
 KEYS=[...new Set(Object.values(MP))].filter(k=>DEX[k]&&(!k.startsWith('NC_')||k in NC));KEYS.forEach(k=>TIERS[k.startsWith('NC_')?NC[k]:tierOf(DEX[k][3].reduce((a,b)=>a+b,0))].push(k))}catch(e){KEYS=[]}}
async function loadSpr(k){if(SPR[k])return SPR[k];const b=BASE+'rz/'+k+'/',meta=await (await fetch(b+k+'.pmd.json')).json(),img={};
 await Promise.all(['walk','idle'].map(async st=>{const A=meta.anims&&meta.anims[st];if(!A)return;try{const q=await fetch(b+A.f+'-Anim.png');if(q.ok)img[st]=await createImageBitmap(await q.blob())}catch(e){}}));
 if(!img.walk&&!img.idle)throw 0;return SPR[k]={meta,img}}
function frameAt(S,A,t){const d=A.d||[];let tot=0;for(let i=0;i<A.n;i++)tot+=d[i]||4;let u=(t*(S.meta.tick||60))%tot;for(let i=0;i<A.n;i++){u-=d[i]||4;if(u<0)return i}return 0}
const ROW={d:0,r:2,u:4,l:6};
function drawSpr(S,st,row,t,cx,by,fit){if(!S||!S.img[st])st=S&&S.img.idle?'idle':'walk';const A=S&&S.meta.anims[st],im=S&&S.img[st];if(!A||!im)return false;
 if(im.height<(row+1)*A.h)row=0;const sc=Math.max(.8,Math.min(1.8,fit/Math.max(A.w,A.h)));x.imageSmoothingEnabled=false;
 x.drawImage(im,frameAt(S,A,t)*A.w,row*A.h,A.w,A.h,Math.round(cx-A.w*sc/2),Math.round(by-A.h*sc),Math.round(A.w*sc),Math.round(A.h*sc));return true}
const nameOf=k=>DEX&&DEX[k]?DEX[k][1]:'펫',pickKey=t=>{const L=TIERS[t].length?TIERS[t]:KEYS;return L.length?L[r(L.length)]:''};
// ---- 상태 ----
const P={x:80,y:200,d:'r',carry:null,stun:0,hit:0},held=[];let EG=[],GU=[],TR=[],BOT=[],RS=300,closed=0,Q=null,batCd=0,swing=0,mt=0,hudT=0,now=0,warn=0;
const bi=()=>P.x<BX?-1:Math.min(8,Math.floor((P.x-BX)/BW));
const TRD={x:30,y:270,w:90,h:60},SHP={x:30,y:40,w:90,h:60},PEN={x:150,y:40,w:210,h:150};
const inR=(o,a,b)=>a>=o.x&&a<=o.x+o.w&&b>=o.y&&b<=o.y+o.h;
function msg(t){$('msg').textContent=t;clearTimeout(mt);mt=setTimeout(()=>$('msg').textContent='',5000)}
function mkEgg(i){const bt=Math.min(4,Math.floor(i*5/9));let t=bt;if(R()<.18)t=Math.min(4,t+1);else if(R()<.25&&t>0)t--;if(R()<.03)t=4;
 const m=R(),mu=m<.01?8:m<.04?4:m<.12?2:1;return{x:BX+i*BW+40+r(BW-80),y:50+r(H-100),i,t,sz:+(.7+R()*R()*2.3).toFixed(2),mu,on:1}}
function spawn(){EG=[];for(let i=0;i<9;i++)for(let k=0;k<4;k++)EG.push(mkEgg(i));TR=[];
 GU.forEach(g=>{g.x=g.hx;g.y=g.hy;g.cd=0})}
function init(){for(let i=0;i<9;i++){const hx=BX+i*BW+BW/2,hy=H/2;GU.push({i,x:hx,y:hy,hx,hy,d:'l',k:'',S:null,cd:0})}
 for(let k=0;k<3;k++)BOT.push({x:BX-30,y:80+k*100,carry:null,stun:0,cool:0,col:['#e55','#59f','#fb3'][k],d:'r'});
 spawn();loadData().then(()=>{GU.forEach(g=>{g.k=pickKey(Math.min(4,Math.floor(g.i*5/9)));if(g.k)loadSpr(g.k).then(S=>g.S=S).catch(()=>0)});S0.pets.slice(0,12).forEach(p=>p.k&&loadSpr(p.k).catch(()=>0))});
 if(FR)$('ex').hidden=false;requestAnimationFrame(loop)}
function mv(o,tx,ty,sp,dt){const dx=tx-o.x,dy=ty-o.y,L=Math.hypot(dx,dy);if(L<1)return L;const k=Math.min(L,sp*dt)/L;o.x+=dx*k;o.y+=dy*k;o.d=Math.abs(dx)>Math.abs(dy)?(dx>0?'r':'l'):(dy>0?'d':'u');return L}
const spd=()=>Math.min(300,120+30*Math.log10(1+es()))*(P.carry?1/(1+.18*P.carry.sz):1);
function drop(o,e){e.x=o.x+r(30)-15;e.y=o.y+r(30)-15;e.on=1}
// ---- 갱신 ----
function update(dt){
 if(closed>0){closed-=dt;if(closed<=0){spawn();RS=300;msg('새 알이 나타났어요!')}return}
 RS-=dt;if(RS<=0){closed=13;P.carry=null;P.x=80;P.y=200;P.stun=0;BOT.forEach(b=>{b.carry=null;b.x=BX-30});EG=[];msg('ALL EGG RESET! 지도가 13초 동안 닫혀요');return}
 batCd-=dt;swing-=dt;warn-=dt;
 if(P.stun>0)P.stun-=dt;else{let vx=0,vy=0;held.forEach(k=>{if(k=='l')vx=-1;if(k=='r')vx=1;if(k=='u')vy=-1;if(k=='d')vy=1});
  if(vx||vy){const L=Math.hypot(vx,vy),s=spd();P.x=Math.max(8,Math.min(W-8,P.x+vx/L*s*dt));P.y=Math.max(14,Math.min(H-8,P.y+vy/L*s*dt));P.d=Math.abs(vx)>=Math.abs(vy)?(vx>0?'r':'l'):(vy>0?'d':'u');if(S0.trq>=0)for(let q=0;q<2;q++)TP.push({x:P.x+R()*8-4,y:P.y+R()*6,l:.7,c:TRL[S0.trq][3]=='rb'?'hsl('+r(360)+',90%,60%)':TRL[S0.trq][3]})}}
 for(let q=TP.length-1;q>=0;q--){TP[q].l-=dt;if(TP[q].l<=0)TP.splice(q,1)}
 // 러닝머신
 if(!P.carry&&inR(TRD,P.x,P.y)&&!held.length){S0.s+=gain()*dt}
 // 알 줍기
 if(!P.carry&&P.stun<=0)for(const e of EG)if(e.on&&Math.hypot(e.x-P.x,e.y-P.y)<20){P.carry=e;e.on=0;P.hit=0;msg('알을 훔쳤다! RUN!! '+TN[e.t]+' 알 · '+MUN[e.mu]+'크기 '+e.sz);break}
 // 펜에 넣기
 if(P.carry&&inR(PEN,P.x,P.y)){if(S0.eg.length>=4){if(warn<=0){warn=3;msg('부화 칸이 가득 찼어요! 상점에서 바로 부화시켜요')}}
  else{const e=P.carry;S0.eg.push({t:e.t,sz:e.sz,mu:e.mu,at:Date.now()});P.carry=null;sv();msg('펜에 알을 놓았어요! 부화를 기다려요 · '+TN[e.t]+' 알'+(FR&&Q!=null?' · 오늘 진짜 알 보상 남은 횟수 '+Math.max(0,Q):''));
   if(FR)parent.postMessage({src:'eggthief',type:'deliver',tier:e.t,killed:false,fought:!!P.hit},location.origin)}}
 // 부화
 for(let i=S0.eg.length-1;i>=0;i--){const e=S0.eg[i];if(Date.now()>=e.at+htOf(e)*1000){S0.eg.splice(i,1);const k=pickKey(e.t),p={k,t:e.t,sz:e.sz,mu:e.mu};S0.pets.push(p);if(k)loadSpr(k).catch(()=>0);sv();msg('부화 성공! '+MUN[e.mu]+nameOf(k)+' ('+TN[e.t]+') 초당 '+fmt(inc(p))+'🪙')}}
 S0.c+=income()*dt;
 // 가디언 (속도 검사)
 const b0=bi();
 GU.forEach(g=>{g.cd-=dt;const need=BM[g.i][1],d=Math.hypot(P.x-g.x,P.y-g.y),act=b0==g.i&&d<(P.carry?280:120)&&P.stun<=0;
  if(act){const slow=es()>=need;mv(g,P.x,P.y,slow?spd()*.5:Math.max(spd(),120)*1.3,dt);
   if(d<26&&g.cd<=0){g.cd=2.5;if(!slow){if(P.carry){drop(P,P.carry);P.carry=null}P.hit=1;P.stun=2;P.x=Math.max(8,P.x-110);msg(BM[g.i][0]+' 가디언에게 잡혔다! 속도가 부족해요 (필요 '+fmt(need)+')')}else msg('속도가 충분해서 가디언이 못 잡아요!')}}
  else mv(g,g.hx,g.hy,70,dt)});
 // 라이벌
 BOT.forEach(b=>{b.cool-=dt;if(b.stun>0){b.stun-=dt;return}
  for(let j=TR.length-1;j>=0;j--)if(Math.hypot(TR[j].x-b.x,TR[j].y-b.y)<16){TR.splice(j,1);b.stun=5;if(b.carry){drop(b,b.carry);b.carry=null}msg('곰덫이 라이벌을 잡았다!');return}
  if(b.carry){if(mv(b,60,b.y,150,dt)<2||b.x<BX-10){b.carry=null;b.x=BX-10}}
  else{let t=null,bd=1e9;for(const e of EG)if(e.on&&e.i<=2&&e.t<=2){const d=Math.hypot(e.x-b.x,e.y-b.y);if(d<bd){bd=d;t=e}}
   if(t){mv(b,t.x,t.y,120+(t.i*10),dt);if(bd<16){b.carry=t;t.on=0}}}
  if(P.carry&&b.cool<=0&&Math.hypot(P.x-b.x,P.y-b.y)<26){b.cool=6;if(R()<.5){drop(P,P.carry);P.carry=null;P.hit=1;P.stun=1.2;msg('라이벌에게 맞아서 알을 놓쳤다!')}}});
}
function swingBat(){if(!S0.bat){msg('상점에서 야구방망이를 사요 (150🪙)');return}if(batCd>0)return;batCd=.6;swing=.2;let hit=0;
 BOT.forEach(b=>{if(Math.hypot(b.x-P.x,b.y-P.y)<64){b.stun=2.5;hit=1;if(b.carry){drop(b,b.carry);b.carry=null}}});msg(hit?'방망이로 쳤다! 떨어진 알을 주워요':'휘두르기!')}
function putTrap(){if(S0.tr<=0){msg('곰덫이 없어요! 상점에서 사요 (60🪙)');return}if(P.x<BX){msg('기지 밖에서 설치해요');return}S0.tr--;TR.push({x:P.x,y:P.y});sv();msg('곰덫을 놓았다! 라이벌이 밟으면 5초 동안 잡혀요 (남은 '+S0.tr+')')}
// ---- 그리기 ----
function egg(px,py,e,sc){const rx=7*Math.sqrt(e.sz)*sc,ry=9*Math.sqrt(e.sz)*sc;x.beginPath();x.ellipse(px,py,rx,ry,0,0,7);
 x.fillStyle=TC[e.t];x.fill();x.lineWidth=2;x.strokeStyle=e.mu==2?'#fc0':e.mu==4?'hsl('+(now*200%360)+',90%,60%)':e.mu==8?'#0f8':'#1c2550';x.stroke();if(e.mu>1){x.fillStyle='#fff8';x.fillRect(px-2,py-ry-6,4,4)}}
function draw(){const cx=Math.max(0,Math.min(W-CW,P.x-CW/2)),t=now;x.clearRect(0,0,CW,H);
 x.fillStyle='#4a5a6a';x.fillRect(-cx,0,BX,H);
 BM.forEach((b,i)=>{const bx=BX+i*BW-cx;if(bx>CW||bx<-BW)return;x.fillStyle=b[2];x.fillRect(bx,0,BW,H);x.fillStyle='#0003';x.fillRect(bx,0,3,H);x.fillStyle=es()>=b[1]?'#fff':'#ffb0b0';x.font='bold 12px sans-serif';x.fillText((es()>=b[1]?'✔ ':'🔒 ')+b[0]+' · 속도 '+(b[1]?fmt(b[1]):'제한없음'),bx+8,16)});
 const bx=-cx;x.font='bold 12px sans-serif';
 x.fillStyle='#2b2f36';x.fillRect(TRD.x+bx,TRD.y,TRD.w,TRD.h);x.fillStyle='#ffd54a';x.fillText('🏃러닝머신',TRD.x+bx+6,TRD.y+34);
 x.fillStyle='#a55';x.fillRect(SHP.x+bx,SHP.y,SHP.w,SHP.h);x.fillStyle='#fff';x.fillText('🏪 상점',SHP.x+bx+16,SHP.y+34);
 x.fillStyle='#5a7a4a';x.fillRect(PEN.x+bx,PEN.y,PEN.w,PEN.h);x.strokeStyle='#fff';x.lineWidth=2;x.strokeRect(PEN.x+bx,PEN.y,PEN.w,PEN.h);x.fillStyle='#fff';x.fillText('🏠 펜 (알 '+S0.eg.length+'/4)',PEN.x+bx+6,PEN.y+14);
 S0.eg.forEach((e,i)=>{egg(PEN.x+bx+30+i*48,PEN.y+50,e,1.1);const l=Math.max(0,Math.ceil(e.at/1000+htOf(e)-Date.now()/1000));x.fillStyle='#fff';x.font='10px sans-serif';x.fillText(l+'초',PEN.x+bx+18+i*48,PEN.y+76)});
 best().slice(0,8).forEach((p,i)=>{const S=SPR[p.k],px=PEN.x+bx+24+i%4*48,py=PEN.y+(i<4?112:146);if(!(p.k&&S&&drawSpr(S,'idle',0,t,px,py,40))){x.fillStyle=TC[p.t];x.fillRect(px-8,py-16,16,16)}});
 x.font='bold 12px sans-serif';
 TR.forEach(o=>{x.fillText('🪤',o.x-8-cx+0,o.y+5)});
 EG.forEach(e=>{if(e.on)egg(e.x-cx,e.y,e,1)});
 GU.forEach(g=>{const gx=g.x-cx;if(gx<-60||gx>CW+60)return;x.fillStyle='#0004';x.beginPath();x.ellipse(gx,g.y,16,6,0,0,7);x.fill();if(!(g.S&&drawSpr(g.S,'walk',ROW[g.d]||0,t,gx,g.y+6,64))){x.font='28px sans-serif';x.fillText('🐲',gx-14,g.y)}x.font='bold 11px sans-serif';x.fillStyle='#fff';x.fillText('가디언',gx-18,g.y-48)});
 BOT.forEach(b=>{x.fillStyle=b.stun>0?'#888':b.col;x.fillRect(b.x-cx-8,b.y-18,16,22);x.fillStyle='#fff';x.font='10px sans-serif';x.fillText('라이벌',b.x-cx-16,b.y-22);if(b.carry)egg(b.x-cx,b.y-30,b.carry,.8)});
 TP.forEach(o=>{x.globalAlpha=Math.max(0,o.l/.7);x.fillStyle=o.c;x.beginPath();x.arc(o.x-cx,o.y,2+o.l*4,0,7);x.fill()});x.globalAlpha=1;
 // 나
 x.fillStyle='#0004';x.beginPath();x.ellipse(P.x-cx,P.y+4,10,4,0,0,7);x.fill();x.fillStyle=P.stun>0?'#999':'#3be';x.fillRect(P.x-cx-8,P.y-20,16,24);x.fillStyle='#fff';x.fillRect(P.x-cx-5,P.y-16,10,6);
 if(P.carry)egg(P.x-cx,P.y-34,P.carry,.9);if(swing>0){x.font='24px sans-serif';x.fillText('🏏',P.x-cx+(P.d=='l'?-30:10),P.y-4)}
 if(P.stun>0){x.font='bold 14px sans-serif';x.fillStyle='#ff0';x.fillText('💫',P.x-cx-8,P.y-46)}
 if(P.carry&&GU.some(g=>g.i==bi()&&Math.hypot(P.x-g.x,P.y-g.y)<280)){x.font='bold 22px sans-serif';x.fillStyle='#f33';x.fillText('RUN!!',CW/2-30,50)}
 if(closed>0){x.fillStyle='#000c';x.fillRect(0,0,CW,H);x.fillStyle='#fff';x.font='bold 24px sans-serif';x.fillText('ALL EGG RESET! '+Math.ceil(closed)+'초',CW/2-120,H/2)}}
function hud(){const b=bi(),nx=BM.findIndex(m=>m[1]>es());$('hud').innerHTML=`🪙 <b>${fmt(S0.c)}</b> (+${fmt(income())}/초) · 🏃속도 <b>${fmt(es())}</b>${S0.trq>=0?' (트레일 ×'+TRL[S0.trq][2]+')':''}${nx>0?' (다음 '+BM[nx][0]+' '+fmt(BM[nx][1])+')':nx<0?' (우주까지 OK!)':''} · 🕒 리셋 ${Math.max(0,Math.ceil(RS))}초 · ${b>=0?BM[b][0]:'기지'}${FR&&Q!=null?' · 진짜 알 '+Math.max(0,Q)+'회':''}`}
// ---- 상점 ----
const row=(i,l,c,sell)=>`<div class="r"><span>${l}</span><button data-i="${i}">${sell?'+':''}${fmt(c)}🪙</button></div>`;
function shop(){const q=Date.now()/1000;let h=`<button id="xs">닫기 ✕</button> 🪙 <b>${fmt(S0.c)}</b> · 수입 ${fmt(income())}/초 · 속도 ${fmt(es())}`;
 h+=row('tl','🏃 러닝머신 Lv.'+S0.tl+' (서 있으면 초당 +'+fmt(gain())+')',tlCost());
 h+=row('pc','🏠 펜 칸 '+S0.pc+' → '+(S0.pc+1)+' (돈 버는 펫 수)',pcCost());
 h+=S0.bat?'<div class="r">🏏 방망이 보유 중</div>':row('bat','🏏 야구방망이 (라이벌을 쳐서 알을 뺏어요)',150);
 h+=row('tr','🪤 곰덫 +1 (보유 '+S0.tr+')',60);
 TRL.forEach((t,i)=>{h+=S0.trl.includes(i)?`<div class="r"><span>✨ ${t[0]} 트레일 (속도 ×${t[2]})${S0.trq==i?' · 장착 중':''}</span><button data-i="te${i}">${S0.trq==i?'해제':'장착'}</button></div>`:row('tb'+i,'✨ '+t[0]+' 트레일 (속도 ×'+t[2]+')',t[1])});
 S0.eg.forEach((e,i)=>{const l=Math.max(0,Math.ceil(e.at/1000+htOf(e)-q));h+=row('sk'+i,'🥚 '+MUN[e.mu]+TN[e.t]+' 알 · '+l+'초 남음 · 바로 부화',l*(1+e.t))});
 const bs=best();S0.pets.slice().sort((a,b)=>inc(b)-inc(a)).forEach(p=>{const i=S0.pets.indexOf(p);h+=row('sl'+i,(bs.includes(p)?'💰 ':'💤 ')+MUN[p.mu]+nameOf(p.k)+' · '+TN[p.t]+' · 크기 '+p.sz+' · 초당 '+fmt(inc(p))+' · 판매',Math.floor(inc(p)*45),1)});
 $('sh').innerHTML=h}
function showShop(){$('sh').hidden=false;shop()}
$('sh').onclick=ev=>{const e=ev.target;if(e.id=='xs'){$('sh').hidden=true;return}const k=e.dataset&&e.dataset.i;if(!k)return;
 const pay=c=>{if(S0.c<c){msg('돈이 부족해요');return false}S0.c-=c;return true};
 if(k=='tl'){if(pay(tlCost()))S0.tl++}else if(k=='pc'){if(pay(pcCost()))S0.pc++}else if(k=='bat'){if(pay(150))S0.bat=1}else if(k=='tr'){if(pay(60))S0.tr++}
 else if(k.startsWith('tb')){const i=+k.slice(2);if(!S0.trl.includes(i)&&pay(TRL[i][1])){S0.trl.push(i);S0.trq=i;msg('✨ '+TRL[i][0]+' 트레일을 샀어요! 속도 ×'+TRL[i][2])}}
 else if(k.startsWith('te')){const i=+k.slice(2);S0.trq=S0.trq==i?-1:i}
 else if(k.startsWith('sk')){const i=+k.slice(2),g=S0.eg[i];if(g){const l=Math.max(0,Math.ceil(g.at/1000+htOf(g)-Date.now()/1000));if(pay(l*(1+g.t)))g.at-=1e9}}
 else if(k.startsWith('sl')){const i=+k.slice(2),p=S0.pets[i];if(p){S0.c+=Math.floor(inc(p)*45);S0.pets.splice(i,1)}}
 sv();shop()};

const KM={ArrowUp:'u',w:'u',ArrowDown:'d',s:'d',ArrowLeft:'l',a:'l',ArrowRight:'r',d:'r'};
addEventListener('keydown',e=>{const k=KM[e.key];if(k){if(!held.includes(k))held.push(k);e.preventDefault()}if(e.key==' ')swingBat();if(e.key=='t')putTrap()});
addEventListener('keyup',e=>{const k=KM[e.key];if(k){const i=held.indexOf(k);if(i>=0)held.splice(i,1)}});
document.querySelectorAll('.dp button').forEach(b=>{const k=b.dataset.d,dn=e=>{e.preventDefault();if(!held.includes(k))held.push(k)},up=()=>{const i=held.indexOf(k);if(i>=0)held.splice(i,1)};
 b.addEventListener('pointerdown',dn);['pointerup','pointerleave','pointercancel'].forEach(n=>b.addEventListener(n,up))});
$('bShop').onclick=()=>{$('sh').hidden?showShop():$('sh').hidden=true};$('bBat').onclick=swingBat;$('bTrap').onclick=putTrap;
$('ex').onclick=()=>{sv();parent.postMessage({src:'eggthief',type:'close'},location.origin)};
addEventListener('message',e=>{const m=e.data;if(m&&m.src==='pka'&&m.type==='quota'){Q=m.max-m.n}});
cv.addEventListener('pointerdown',e=>{const rc=cv.getBoundingClientRect(),cx=Math.max(0,Math.min(W-CW,P.x-CW/2)),mx=(e.clientX-rc.left)/rc.width*CW+cx,my=(e.clientY-rc.top)/rc.height*H;if(inR(SHP,mx,my))showShop()});
let lt=performance.now(),sc=0;
function loop(n){const dt=Math.min(.05,(n-lt)/1000);lt=n;now=n/1000;update(dt);draw();hudT-=dt;if(hudT<=0){hudT=.25;hud();if(!$('sh').hidden)shop()}sc+=dt;if(sc>10){sc=0;sv()}requestAnimationFrame(loop)}
