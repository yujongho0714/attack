<script>
'use strict';
/* =====================================================================
   1. 소리
   ===================================================================== */
class SFX{constructor(){this.ctx=null;this.muted=false}
  init(){if(!this.ctx)this.ctx=new(window.AudioContext||window.webkitAudioContext)();if(this.ctx.state==='suspended')this.ctx.resume()}
  play(f,t='sine',d=.12,v=.13,e=null){if(this.muted||!this.ctx)return;const o=this.ctx.createOscillator(),g=this.ctx.createGain(),c=this.ctx.currentTime;o.type=t;o.frequency.setValueAtTime(f,c);if(e)o.frequency.exponentialRampToValueAtTime(e,c+d);g.gain.setValueAtTime(v,c);g.gain.exponentialRampToValueAtTime(.001,c+d);o.connect(g);g.connect(this.ctx.destination);o.start();o.stop(c+d)}
  seq(a,t='triangle',gap=70,d=.2){a.forEach((f,i)=>setTimeout(()=>this.play(f,t,d,.14),i*gap))}
  tick(){this.play(380+Math.random()*140,'sine',.07,.07,620)}pop(){this.play(520,'triangle',.1,.14,880)}roar(){this.play(150,'sawtooth',.35,.2,65)}
  bonk(){this.play(260,'square',.14,.16,90)}trap(){this.play(720,'sawtooth',.16,.16,220)}hatch(){this.seq([523,659,784,1047])}
  night(){this.seq([440,349,294],'sine',140,.35)}coin(){this.play(988,'sine',.1,.12,1319)}jump(){this.play(260,'sine',.14,.11,520)}}
const sfx=new SFX();

/* =====================================================================
   2. 데이터 — 알 10등급 · 크기 5 · 변이 8 · 러닝머신 8 · 꼬리 10 · 지역 8
   ===================================================================== */
const RAR=[
  {n:'일반',c:'#cbd5e1',w:.04,e:['#fff4d6','#e8c47a',0]},{n:'고급',c:'#4ade80',w:.07,e:['#e6ffe9','#3fbf5f',0]},
  {n:'희귀',c:'#38bdf8',w:.10,e:['#d6f0ff','#3a8fe0',1]},{n:'영웅',c:'#c084fc',w:.14,e:['#f2e6ff','#a855f7',1]},
  {n:'전설',c:'#facc15',w:.18,e:['#fff6c8','#f0aa22',2],g:0xffd23f},{n:'신화',c:'#fb7185',w:.22,e:['#ffe1e6','#e24870',2],g:0xff5577},
  {n:'코스믹',c:'#818cf8',w:.26,e:['#1e1b4b','#9fb0ff',2],g:0x6d7dff},{n:'시크릿',c:'#2dd4bf',w:.30,e:['#0f2f2c','#3ef0d0',1],g:0x2dd4bf},
  {n:'이터널',c:'#f97316',w:.34,e:['#3a1204','#ff9d2e',2],g:0xff7a1a},{n:'디바인',c:'#fef08a',w:.38,e:['#fffbe0','#ffd23f',2],g:0xfff3a0}
];
const SIZES=[{n:'소형',m:.8,s:.78,w:22,p:-.02},{n:'보통',m:1,s:1,w:46,p:0},{n:'대형',m:1.3,s:1.25,w:18,p:.04},{n:'거대',m:1.75,s:1.55,w:10,p:.08},{n:'콜로서스',m:2.5,s:1.95,w:4,p:.14}];
const MUTS=[{n:'',m:1,w:52,t:0},{n:'골드',m:1.4,w:16,t:0xffe27a,c:'#ffd23f'},{n:'다이아',m:1.8,w:11,t:0xb8f0ff,c:'#8fe3ff'},{n:'번개',m:2,w:8,t:0xfff6a0,c:'#fff36b'},
  {n:'마법',m:2.2,w:6,t:0xe0b8ff,c:'#d9a8ff'},{n:'무지개',m:2.5,w:3.5,t:0xffc8ec,c:'#ff9de0'},{n:'균열',m:2.75,w:2,t:0xc89bff,c:'#b48cff'},{n:'꽃정령',m:3,w:1.5,t:0xffd0dc,c:'#ffb3c6'}];
const TMS=[
  {n:'기본 러닝머신',g:3,c:0,img:'tm_gray'},{n:'공상과학 러닝머신',g:12,c:180,img:'tm_cyan'},{n:'불꽃 러닝머신',g:55,c:1200,img:'tm_lava'},{n:'스타 러닝머신',g:260,c:8500,img:'tm_elec'},
  {n:'황금 러닝머신',g:1400,c:65000,img:'tm_gold'},{n:'얼음 러닝머신',g:7500,c:480000,img:'tm_ice'},{n:'로켓 러닝머신',g:42000,c:3500000,img:'tm_rocket'},{n:'천사 러닝머신',g:250000,c:28000000,img:'tm_angel'}];
const TRAILS=[
  {n:'꼬리 없음',m:1,c:0},{n:'새싹 꼬리',m:1.2,c:120},{n:'물결 꼬리',m:1.45,c:900},{n:'보라 오라',m:1.8,c:6500},{n:'태양 불꽃',m:2.3,c:45000},
  {n:'진홍 불꽃',m:3,c:320000},{n:'성운 꼬리',m:4,c:2200000},{n:'유령 꼬리',m:5.5,c:15000000},{n:'지옥불',m:7.5,c:110000000},{n:'천상의 빛',m:11,c:850000000}];

  if(kind==='oak'){add(new THREE.BoxGeometry(.6,2.4,.6),trunk,1.2);add(new THREE.BoxGeometry(2.6,1.6,2.6),L(0x3f9b3a),3);add(new THREE.BoxGeometry(1.8,1,1.8),L(0x4fb548),4.1)}

  else if(kind==='cactus'){const c=L(0x3f9b4a);add(new THREE.BoxGeometry(.7,3,.7),c,1.5);add(new THREE.BoxGeometry(.45,1.2,.45),c,2,.7);add(new THREE.BoxGeometry(.45,1,.45),c,2.4,-.7)}

function rollMut(){const L=save.bo.luck>0?2.2:1;const w=MUTS.map((m,i)=>i?m.w*L:m.w),T=w.reduce((a,b)=>a+b,0);let r=Math.random()*T;for(let i=0;i<w.length;i++){if(r<w[i])return i;r-=w[i]}return 0}

}

function setCarry(it){ST.carry=it;if(carryMesh){scene.remove(carryMesh);carryMesh=null}if(it){carryMesh=eggMesh(it.pid,.8*SIZES[it.sz].s);scene.add(carryMesh)}drawCarryIcon();updateHUD()}
function drawCarryIcon(){const c=$('carryC'),x=c.getContext('2d');x.clearRect(0,0,40,40);const it=ST.carry;const r=it?RAR[PETS[it.pid].r]:null;
  x.fillStyle=r?r.e[0]:'#555b70';x.strokeStyle='#0b1020';x.lineWidth=3;x.beginPath();x.ellipse(20,22,12,15,0,0,7);x.fill();x.stroke();if(r){x.fillStyle=r.e[1];[[15,16],[24,22],[17,29]].forEach(p=>{x.beginPath();x.arc(p[0],p[1],3,0,7);x.fill()})}}
function toggleMount(){
  if(save.mount<0||!save.mounts[save.mount])return toast('기지 메뉴에서 별똥별로 포켓몬을 탈것으로 바꿔요','#d9b8ff');
  ST.ride=!ST.ride;if(mountPoke){scene.remove(mountPoke.root);mountPoke=null}
  if(ST.ride){const md=save.mounts[save.mount];mountPoke=new VOX.Poke('../rz/',md.p,{size:1.1*SIZES[md.sz].s,tint:MUTS[md.mu].t||0});scene.add(mountPoke.root);sfx.pop();toast(nm(md.p)+' 에 탔어요! 알 무게를 안 느껴요','#d9b8ff')}
  else toast('탈것에서 내렸어요','#c9d7f2')}
// 라이벌 도둑 (옷을 랜덤으로 입힌 바람 캐릭터)
const RIVN=['그림자도둑','알사냥꾼99','번개발X'];
async function buildRivals(){
  const pk=hero.pk;const pick=c=>{const L=(pk&&pk.cats[c])||[];return L.length?c+':'+L[Math.floor(Math.random()*L.length)].id:null};
  for(let i=0;i<3;i++){const h=new VOX.Hero('../dressup/');h.pk=pk;const eq={};['coat','hair','weapon','helmet'].forEach(c=>{if(c==='helmet'&&Math.random()<.5)return;const v=pick(c);if(v)eq[c]=v});await h.dress(eq);
    const L=labelSprite(RIVN[i],'#ff9aa6');scene.add(h.root,L);
    W.rivals.push({n:RIVN[i],h,L,pos:new THREE.Vector3(14+i*3,0,8-i*5),mode:i===1?'RAID':'ROAM',tgt:new THREE.Vector3(12,0,-30),stun:0,snare:0,hx:0,hz:1})}}
function syncSlots(){
  W.slots.forEach((sm,i)=>{sm.ring.material.color.setHex(i<save.slotsN?0x38bdf8:0x475569);sm.ring.material.opacity=i<save.slotsN?.85:.35;
    if(sm.obj){sm.gr.remove(sm.obj);sm.obj=null}if(sm.poke){sm.gr.remove(sm.poke.root);sm.poke=null}
    const d=save.slots[i];if(!d)return;
    if(d.st==='EGG'){const m=eggMesh(d.p,SIZES[d.sz].s);m.position.y=.25;sm.gr.add(m);sm.obj=m}
    else{const p=new VOX.Poke('../rz/',d.p,{size:.7*SIZES[d.sz].s,tint:MUTS[d.mu].t||0});p.root.position.y=.2;sm.gr.add(p.root);sm.poke=p}})}

   6. 계산 · 화면

const $=id=>document.getElementById(id);
function fmt(n){n=+n||0;if(n>=1e12)return(n/1e12).toFixed(2)+'조';if(n>=1e8)return(n/1e8).toFixed(2)+'억';if(n>=1e4)return(n/1e4).toFixed(1)+'만';return Math.floor(n).toLocaleString()}
function toast(t,c='#ffe16b'){const e=document.createElement('div');e.className='toast sh';e.style.color=c;e.textContent=t;const L=$('toasts');L.appendChild(e);while(L.children.length>3)L.firstChild.remove();setTimeout(()=>e.remove(),1700)}
const idxMult=()=>1+Math.floor(save.dex.length/5)*.05;
function slotInc(s){return PETS[s.p].inc*SIZES[s.sz].m*MUTS[s.mu].m}
function income(){let s=0;save.slots.forEach(d=>{if(d&&d.st==='PET')s+=slotInc(d)});return Math.round(s*idxMult()*(save.bo.cash>0?2:1))}
function bestInc(){let b=0;save.slots.forEach(d=>{if(d&&d.st==='PET')b=Math.max(b,slotInc(d))});return Math.min(900,Math.round(Math.log10(b+1)*110))}
function updateHUD(){
  $('hCash').textContent=fmt(save.cash);$('hInc').textContent='+'+fmt(income())+'/초';$('hSpd').textContent=fmt(save.speed);$('hSp').textContent=save.shards+' · '+save.trophies;
  const B=[];if(save.bo.cash>0)B.push(['골드 2배',save.bo.cash,'#7cf0a4']);if(save.bo.speed>0)B.push(['훈련 2배',save.bo.speed,'#8fe3ff']);if(save.bo.luck>0)B.push(['변이 행운',save.bo.luck,'#ffb0ff']);
  $('buffs').innerHTML=B.map(b=>`<span class="pnl" style="color:${b[2]}">${b[0]} ${Math.ceil(b[1])}초</span>`).join('');
  const sh=$('shieldS');if(ST.shT>0){sh.textContent='방어막 켜짐 '+Math.ceil(ST.shT)+'초';sh.style.color='#7cf0a4'}else if(ST.shCD>0){sh.textContent='방어막 충전 '+Math.ceil(ST.shCD)+'초';sh.style.color='#9aa6bd'}else{sh.textContent='방어막 준비됨 [V]';sh.style.color='#8fe3ff'}
  const c=ST.carry;if(c){const r=RAR[PETS[c.pid].r],pen=ST.ride?0:Math.round(Math.min(.65,Math.max(0,r.w+SIZES[c.sz].p))*100);$('carryT').textContent='들고 있는 알 · 무거워서 '+pen+'% 느려요'+(ST.ride?' (탈것 덕분에 0%)':'');$('carryD').innerHTML=`<span class="rr" style="background:${r.c}">${r.n}</span> ${SIZES[c.sz].n} ${nm(c.pid)}`}
  else{$('carryT').textContent='들고 있는 알';$('carryD').textContent='없음 · 야생이나 라이벌 기지에서 훔쳐요'}
}

/* =====================================================================
   7. 행동: E 훔치기/놓기 · F 방망이 · G 덫 · V 방어막

const P={pos:new THREE.Vector3(-4,0,10),vel:new THREE.Vector3(),ground:true};
function near(x,z,r){return Math.hypot(P.pos.x-x,P.pos.z-z)<r}
function act(){
  if(!ST.started)return;
  if(!save.gift&&near(-6.5,13,3.6)){save.gift=true;save.speed+=10000;if(!save.trs.includes(2))save.trs.push(2);save.tr=2;persist();updateHUD();sfx.hatch();toast('선물! 속도 +10,000 · 물결 꼬리','#7cf0a4');return}
  if(ST.boss.on&&near(0,-12,7)){const d=Math.max(8,Math.round(10+Math.log10(Math.max(10,save.speed))*6));ST.boss.hp-=d;ST.atk=.5;sfx.bonk();fxBurst(new THREE.Vector3(0,3,-12),0xf43f5e);toast('보스 공격! -'+d+'  남은 체력 '+Math.max(0,ST.boss.hp),'#ffb0ff');
    if(ST.boss.hp<=0){ST.boss.on=false;W.boss.root.visible=W.bossRing.visible=false;$('evB').classList.add('hide');const r=15+Math.floor(Math.random()*10);save.shards+=r;persist();updateHUD();sfx.hatch();toast('균열 보스를 물리쳤어요! 파편 +'+r,'#ffe16b')}return}
  if(ST.carry){let si=-1,md=3.4;for(let i=0;i<save.slotsN;i++){if(save.slots[i])continue;const d=Math.hypot(P.pos.x-W.slots[i].x,P.pos.z-W.slots[i].z);if(d<md){md=d;si=i}}
    if(si<0)return toast('내 기지의 빈 파란 둥지 옆에서 눌러요','#8fe3ff');
    const it=ST.carry,pp=PETS[it.pid];save.slots[si]={st:'EGG',p:it.pid,sz:it.sz,rem:pp.ht,tot:pp.ht,sak:it.src==='sakura',mu:0};
    setCarry(null);ST.chase=null;$('vign').classList.add('hide');syncSlots();persist();sfx.coin();toast(nm(it.pid)+' 알을 '+(si+1)+'번 둥지에! 부화 시작','#8fe3ff');
    if(FR&&it.src!=='lab')parent.postMessage({src:'eggthief',type:'deliver',tier:Math.min(4,Math.floor(pp.r/2)),killed:false,fought:ST.fought},location.origin);ST.fought=false;return}
  for(const rs of W.rs){if(rs.egg&&near(rs.x,rs.z,3.4)){setCarry(rs.egg);setSprint(true);rs.egg=null;scene.remove(rs.mesh);rs.mesh=null;sfx.roar();toast('라이벌 기지에서 '+nm(ST.carry.pid)+' 알을 훔쳤어요!','#ff9aa6');return}}
  if(ST.night)return toast('밤에는 야생 입구가 막혀요','#b8c4ff');
  let bi=-1,bd=3.8;W.eggs.forEach((w,i)=>{const d=Math.hypot(P.pos.x-w.x,P.pos.z-w.z);if(d<bd){bd=d;bi=i}});
  if(bi<0)return;const w=W.eggs.splice(bi,1)[0];scene.remove(w.m);if(w.glow)scene.remove(w.glow);setCarry({pid:w.pid,sz:w.sz,src:w.b.id});
  const g=W.guards.find(g=>g.b.id===w.b.id);if(g){g.aggro=true;ST.chase=g;$('vign').classList.remove('hide')}setSprint(true);sfx.roar();toast(nm(w.pid)+' 알을 훔쳤다! 가속 켜짐 · 도망쳐요!','#ff9aa6')}
function bat(){
  if(!ST.started||ST.batCD>0)return;ST.batCD=.55;ST.atk=.5;sfx.bonk();
  W.rivals.forEach(r=>{if(P.pos.distanceTo(r.pos)<4){r.stun=3.5;r.pos.add(new THREE.Vector3().subVectors(r.pos,P.pos).setY(0).normalize().multiplyScalar(9));fxBurst(r.pos.clone().setY(2),0xffd23f);toast(r.n+' 을(를) 날려 보냈어요!','#ff9aa6')}});
  W.guards.forEach(g=>{if(P.pos.distanceTo(g.pos)<5){g.stun=1.4;ST.fought=true;fxBurst(g.pos.clone().setY(2.5),0xffffff);toast(g.b.gn+' 기절 1.4초!','#ffe16b')}})}
function trap(){
  if(!ST.started)return;if(save.cash<50)return toast('덫은 50골드예요','#ff9aa6');
  if(W.traps.length>=4){const o=W.traps.shift();scene.remove(o.m)}save.cash-=50;
  const m=new THREE.Group();const base=new THREE.Mesh(new THREE.CylinderGeometry(1.1,1.1,.14,16),M({color:0x555b66,metalness:.8,roughness:.3}));const jaw=new THREE.Mesh(new THREE.TorusGeometry(.9,.1,6,16),M({color:0xd0d6e0,metalness:.9,roughness:.2}));jaw.rotation.x=Math.PI/2;jaw.position.y=.12;m.add(base,jaw);m.position.set(P.pos.x,.07,P.pos.z);m.traverse(o=>{if(o.isMesh)o.castShadow=true});scene.add(m);
  W.traps.push({x:P.pos.x,z:P.pos.z,m});sfx.trap();updateHUD();toast('덫을 놓았어요','#ffe16b')}
function shield(){
  if(!ST.started)return;if(ST.shT>0)return toast('방어막이 이미 켜져 있어요','#8fe3ff');if(ST.shCD>0)return toast('방어막 충전 중 '+Math.ceil(ST.shCD)+'초','#9aa6bd');
  ST.shT=25;ST.shCD=45;W.shield.visible=true;sfx.pop();updateHUD();toast('기지 방어막 25초! 라이벌이 못 들어와요','#8fe3ff')}
function setSprint(on){ST.sprint=on;const b=$('bRun');b.className='btn tb '+(on?'g':'k');$('tRun').textContent=on?'가속 켬':'가속 끔'}
function jump(){if(P.ground){P.vel.y=11.5;P.ground=false;sfx.jump()}}
// 터지는 빛
const BURST=[];function fxBurst(p,col){for(let i=0;i<10;i++){const m=new THREE.Mesh(new THREE.BoxGeometry(.25,.25,.25),new THREE.MeshBasicMaterial({color:col,transparent:true}));m.position.copy(p);scene.add(m);BURST.push({m,v:new THREE.Vector3((Math.random()-.5)*8,Math.random()*7,(Math.random()-.5)*8),l:.6})}}

const MH={shop:['상점','../ui/ic_shop.webp','러닝머신 · 꼬리 · 둥지 · 파편 상점',[['tm','러닝머신'],['tr','꼬리'],['slot','둥지'],['sh','파편 상점']]],
  pets:['내 기지','../ui/ic_egg.webp','부화한 포켓몬은 돈을 벌어요. 별똥별로 탈것으로 바꿀 수도 있어요.',[['base','둥지'],['mount','탈것']]],
  index:['도감','../items/POKEBALL.png','5종 모을 때마다 모든 수익 +5%',[]],
  lab:['연구소','../ui/ic_fuse.webp','특별한 포켓몬을 만들고, 달리기 대회에 나가요',[['lab','박사님 합성'],['fuse','천사와 악마 융합'],['race','달리기 대회']]],
  map:['지역 지도','../ui/ic_map.webp','지역마다 필요한 속도와 알 포켓몬이에요',[]]};
function openM(m,tab){ST.mode=m;const h=MH[m];$('mtitle').textContent=h[0];$('mimg').src=h[1];$('mdesc').textContent=m==='index'?'5종 모을 때마다 모든 수익 +5% (지금 +'+Math.floor(save.dex.length/5)*5+'%) · '+save.dex.length+'/'+ALLP.length:h[2];
  ST.tab=tab||(h[3][0]||[''])[0];$('mtabs').innerHTML=h[3].map(t=>`<button class="btn ${t[0]===ST.tab?'y':'k'}" data-t="${t[0]}">${t[1]}</button>`).join('');
  $('mtabs').querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>openM(m,b.dataset.t));$('mback').classList.remove('hide');renderM()}
function closeM(){$('mback').classList.add('hide')}
const rr=i=>`<span class="rr" style="background:${RAR[i].c}">${RAR[i].n}</span>`;
const mut=i=>i?`<span class="mut" style="background:${MUTS[i].c}">${MUTS[i].n}</span>`:'';
function buy(list,owned,cur,i,cost,set){if(cur===i)return;if(!owned.includes(i)){if(save.cash<cost)return toast('골드가 모자라요','#ff9aa6');save.cash-=cost;owned.push(i);sfx.hatch()}set(i);persist();updateHUD();renderM()}
function renderM(){
  const B=$('mbody'),t=ST.tab,m=ST.mode;B.innerHTML='';
  const card=(img,name,desc,btn,cls,on,lock,rc)=>`<div class="card${on?' on':''}${lock?' lock':''}" style="--rc:${rc||'#4b6699'}"><div class="im"><img src="${img}" class="px" alt=""></div><div class="nm">${name}</div><div class="ds">${desc}</div>${btn?`<button class="btn ${cls}">${btn}</button>`:''}</div>`;
  if(m==='shop'&&t==='tm'){B.innerHTML='<div class="grid">'+TMS.map((x,i)=>{const own=save.tms.includes(i),eq=save.tm===i;return card(stripThumb(x.img),x.n,'한 번 뛸 때 속도 +'+fmt(x.g),eq?'쓰는 중':own?'쓰기':fmt(x.c)+' 골드',eq?'k':own?'g':'y',eq,!own&&save.cash<x.c)}).join('')+'</div>';
    B.querySelectorAll('.card .btn').forEach((b,i)=>b.onclick=()=>buy(TMS,save.tms,save.tm,i,TMS[i].c,j=>{save.tm=j;W.tmGeo={}}))}
  else if(m==='shop'&&t==='tr'){B.innerHTML='<div class="grid">'+TRAILS.map((x,i)=>{const own=save.trs.includes(i),eq=save.tr===i;return card(i?trailThumb(i):'../ui/ic_stop.webp',x.n,'러닝머신 훈련 x'+x.m,eq?'쓰는 중':own?'쓰기':fmt(x.c)+' 골드',eq?'k':own?'g':'p',eq,!own&&save.cash<x.c)}).join('')+'</div>';
    B.querySelectorAll('.card .btn').forEach((b,i)=>b.onclick=()=>buy(TRAILS,save.trs,save.tr,i,TRAILS[i].c,j=>save.tr=j))}
  else if(m==='shop'&&t==='slot'){const max=save.slotsN>=16,cost=Math.round(150*Math.pow(2.15,save.slotsN-4));
    B.innerHTML=`<div class="row2"><img class="fc px" src="../ui/ic_egg.webp" style="background:#2a3044" alt=""><div class="tx"><b>둥지 ${save.slotsN} / 16칸</b><small>알을 더 많이 동시에 부화시켜요</small></div><button id="bSlot" class="btn ${max?'k':'y'}">${max?'최대':fmt(cost)+' 골드'}</button></div>`;
    $('bSlot').onclick=()=>{if(max)return;if(save.cash<cost)return toast('골드가 모자라요','#ff9aa6');save.cash-=cost;save.slotsN++;syncSlots();persist();updateHUD();renderM();sfx.coin()}}
  else if(m==='shop'&&t==='sh'){const IT=[['../ui/ic_star.webp','별똥별','지금 '+save.stars+'개 · 포켓몬을 탈것으로 바꿔요','2,500 골드',()=>{if(save.cash<2500)return toast('2,500골드가 필요해요','#ff9aa6');save.cash-=2500;save.stars++;toast('별똥별 +1','#d9b8ff')}],
      ['../ui/ic_fast.webp','훈련 2배 (60초)','러닝머신 속도 증가 2배','파편 5',()=>{if(save.shards<5)return toast('파편이 모자라요 (균열 보스)','#ff9aa6');save.shards-=5;save.bo.speed+=60;toast('훈련 2배!','#8fe3ff')}],
      ['../ui/ic_money.webp','골드 2배 (60초)','기지 포켓몬 수익 2배','파편 5',()=>{if(save.shards<5)return toast('파편이 모자라요','#ff9aa6');save.shards-=5;save.bo.cash+=60;toast('골드 2배!','#7cf0a4')}],
      ['../foodthrow/img/ic_clover.webp','변이 행운 (90초)','부화할 때 변이 확률 2.2배','파편 8',()=>{if(save.shards<8)return toast('파편이 모자라요','#ff9aa6');save.shards-=8;save.bo.luck+=90;toast('변이 행운!','#ffb0ff')}]];
    B.innerHTML=IT.map((x,i)=>`<div class="row2"><img class="fc px" src="${x[0]}" style="background:#2a3044;object-fit:contain" alt=""><div class="tx"><b>${x[1]}</b><small>${x[2]}</small></div><button class="btn p" data-i="${i}">${x[3]}</button></div>`).join('');
    B.querySelectorAll('[data-i]').forEach(b=>b.onclick=()=>{IT[+b.dataset.i][4]();sfx.hatch();persist();updateHUD();renderM()})}
  else if(m==='pets'&&t==='base'){let h='';for(let i=0;i<save.slotsN;i++){const s=save.slots[i];
      if(!s){h+=`<div class="row2"><div class="tx"><b style="color:#9aa6bd">${i+1}번 둥지 · 비어 있어요</b></div></div>`;continue}
      const p=PETS[s.p];if(s.st==='EGG'){h+=`<div class="row2"><img class="fc px" src="${face(s.p)}" style="filter:brightness(0) opacity(.5)" alt=""><div class="tx"><b>${i+1}번 · ${rr(p.r)} ${SIZES[s.sz].n} 알 (부화 중)</b><small>${Math.ceil(s.rem)}초 남음${ST.night?' · 밤이라 30배 빨라요':''}</small><div class="bar"><i style="width:${100-s.rem/s.tot*100}%"></i></div></div></div>`;continue}
      const inc=Math.round(slotInc(s)*idxMult());h+=`<div class="row2"><img class="fc px" src="${face(s.p)}" alt=""><div class="tx"><b>${i+1}번 · ${mut(s.mu)}${nm(s.p)} ${rr(p.r)} ${SIZES[s.sz].n}</b><small>+${fmt(inc)}/초</small></div><button class="btn p" data-mt="${i}">탈것 (별 ${save.stars})</button><button class="btn r" data-sl="${i}">팔기 +${fmt(inc*10)}</button></div>`}
    B.innerHTML=h;
    B.querySelectorAll('[data-mt]').forEach(b=>b.onclick=()=>{const i=+b.dataset.mt,s=save.slots[i];if(save.stars<=0)return toast('별똥별이 없어요 (상점 · 밤에 떨어져요)','#ff9aa6');save.stars--;save.mounts.push({p:s.p,sz:s.sz,mu:s.mu});save.mount=save.mounts.length-1;save.slots[i]=null;syncSlots();persist();updateHUD();renderM();sfx.hatch();toast(nm(s.p)+' 탈것 등록! R로 타요','#d9b8ff')});

          V.subVectors(r.tgt,r.pos).setY(0);if(V.length()<1.5){if(r.mode==='RAID'&&Math.random()<.45&&ST.shT<=0)r.tgt.set(-16,0,2);else r.tgt.set((Math.random()-.5)*90,0,ST.night?Math.random()*14:-10-Math.random()*90)}
          else{V.normalize();r.pos.addScaledVector(V,7.8*dt);r.hx=V.x;r.hz=V.z;mv2=true}}}
      r.h.root.position.copy(r.pos);r.h.root.rotation.z=r.stun>0?.6:0;r.h.tick(now,camera,r.hx,r.hz,mv2,0);r.L.position.set(r.pos.x,3.6,r.pos.z)});
    // 터짐 · 꼬리
    for(let i=BURST.length-1;i>=0;i--){const b=BURST[i];b.l-=dt;b.v.y-=18*dt;b.m.position.addScaledVector(b.v,dt);b.m.material.opacity=Math.max(0,b.l/.6);if(b.l<=0){scene.remove(b.m);BURST.splice(i,1)}}
    for(let i=W.trail.length-1;i>=0;i--){const t=W.trail[i];t.l-=dt;t.s.material.opacity=Math.max(0,t.l/.45);if(t.l<=0){scene.remove(t.s);t.s.material.map.dispose();W.trail.splice(i,1)}}
    updateCtx();
    // 주인공
    const ry=ST.ride&&mountPoke?1.25*(mountPoke.size):0;
    if(mountPoke){mountPoke.root.position.set(P.pos.x,P.pos.y,P.pos.z);mountPoke.tick(dt,camera,V.lengthSq()>.001?V.x:0,V.lengthSq()>.001?V.z:0)}
    hero.root.position.set(P.pos.x,P.pos.y+ry,P.pos.z);hero.tick(now,camera,ST.face.x,ST.face.z,mv&&!ST.ride,ST.atk);
    if(carryMesh){carryMesh.position.set(P.pos.x,P.pos.y+ry+3.1+Math.sin(now*.006)*.08,P.pos.z);carryMesh.rotation.y+=dt*2}
  }
  // 카메라 · 그림자 따라가기
  const R=12.5,cx=P.pos.x+Math.sin(ST.yaw)*Math.cos(ST.pitch)*R,cy=P.pos.y+2.7+Math.sin(ST.pitch)*R,cz=P.pos.z+Math.cos(ST.yaw)*Math.cos(ST.pitch)*R;
  camera.position.lerp(V.set(cx,cy,cz),.18);camera.lookAt(P.pos.x,P.pos.y+1.8,P.pos.z);
  sun.position.set(P.pos.x+30,60,P.pos.z+25);sun.target.position.set(P.pos.x,0,P.pos.z);
  renderer.render(scene,camera);
}
function updateCtx(){
  const box=$('ctx'),bt=$('tAct');const show=(t,b)=>{box.textContent=t;box.classList.remove('hide');if(b)bt.textContent=b};
  if(!save.gift&&near(-6.5,13,3.6))return show('[E] 선물 상자 열기  (속도 +10,000 · 꼬리)','선물 열기 [E]');
  if(ST.boss.on&&near(0,-12,7))return show('[E] 균열 보스 공격  (체력 '+Math.max(0,ST.boss.hp)+'/'+ST.boss.max+')','보스 공격 [E]');
  if(ST.carry){for(let i=0;i<save.slotsN;i++)if(!save.slots[i]&&near(W.slots[i].x,W.slots[i].z,3.4))return show('[E] '+(i+1)+'번 둥지에 '+nm(ST.carry.pid)+' 알 놓기','둥지에 놓기 [E]');box.classList.add('hide');bt.textContent='기지로 도망쳐요!';return}
  for(const g of W.gates)if(save.speed<g.b.req&&Math.abs(P.pos.z-g.b.z0)<3.5)return show(g.b.n+' 은(는) 속도 '+fmt(g.b.req)+' 이 필요해요');
  const rs=W.rs.find(r=>r.egg&&near(r.x,r.z,3.4));if(rs)return show('[E] 라이벌 기지의 '+nm(rs.egg.pid)+' 알 훔치기','라이벌 알 훔치기 [E]');
  const w=W.eggs.find(w=>near(w.x,w.z,3.8));if(w){const r=RAR[PETS[w.pid].r];return show('[E] '+r.n+' '+SIZES[w.sz].n+' '+nm(w.pid)+' 알 훔치기  (권장 속도 '+fmt(w.b.gs)+')','알 훔치기 [E]')}
  box.classList.add('hide');bt.textContent='훔치기 · 놓기 [E]'}
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});

/* =====================================================================
   12. 포켓몬 게임과 연결 (진짜 알 보상 · 게임돈)
   ===================================================================== */
const FR=window.parent!==window;
function xflush(force){if(!FR)return;const n=Math.floor(save.gp||0);if(n>=1){save.gp-=n;parent.postMessage({src:'eggthief',type:'exchange',amt:n,best:bestInc()},location.origin)}else if(force)parent.postMessage({src:'eggthief',type:'exchange',amt:0,best:bestInc()},location.origin)}
let gotMe=null;
addEventListener('message',e=>{const m=e.data;if(e.origin!==location.origin||!m)return;
  if(m.src==='poke'&&m.type==='me'&&m.eq&&Object.keys(m.eq).length){gotMe=m.eq;if(hero.F)hero.dress(m.eq)}
  if(m.src==='pka'&&m.type==='quota'){const q=$('quota');q.textContent='오늘 진짜 알 '+m.n+'/'+m.max;q.classList.remove('hide')}
  if(m.src==='pka'&&m.type==='wallet'){const q=$('quota');q.textContent=(q.textContent.split(' · ')[0]||'')+' · 게임돈 '+fmt(m.paid)+'/'+fmt(m.cap);q.classList.remove('hide')}});
if(FR){$('pkExit').style.display='flex';$('pkExit').onclick=()=>{xflush(true);persist();parent.postMessage({src:'eggthief',type:'close'},location.origin)};try{parent.postMessage({src:'eggthief',type:'hello'},location.origin)}catch(e){}}

/* =====================================================================
   13. 시작
   ===================================================================== */
async function boot(){
  const IM=['gate_1','gate_2','gate_3','gate_5','gate_6','gate_7','gate_8','gate_9','hub_fountain','hub_flags','hub_flowers'];
  const FX=['tm_gray','tm_cyan','tm_lava','tm_elec','tm_gold','tm_ice','tm_rocket','tm_angel',...[1,2,3,4,5,6,7,8,9].map(i=>'tl_'+i)];
  let d=0;const tot=IM.length+FX.length+ALLP.length+BIOMES.length;const step=()=>{$('sload').firstChild.style.width=Math.round(++d/tot*100)+'%'};
  await Promise.all([...IM.map(async n=>{IMG[n]=await VOX.loadImg('../foodthrow/img/'+n+'.webp');step()}),...FX.map(async n=>{IMG[n]=await VOX.loadImg('fx/'+n+'.webp');step()}),
    ...ALLP.map(async k=>{const p=await VOX.pkLoad('../rz/',k);if(p){KO[k]=p.meta.name;DEXN[k]=p.meta.dex}step()}),...BIOMES.map(async b=>{const p=await VOX.pkLoad('../rz/',b.gk);if(p){KO[b.gk]=p.meta.name;DEXN[b.gk]=p.meta.dex}step()})]);
  await new Promise(r=>setTimeout(r,FR?300:0));
  await hero.dress(gotMe||{coat:'coat:001',hair:'hair:001'});scene.add(hero.root);
  buildBase();buildBiomes();resetEggs();syncSlots();await buildRivals();drawCarryIcon();updateHUD();
  $('bPlay').classList.remove('off');$('bPlay').textContent='시작하기';
  // 시작 화면 뒤로 기지가 보이게
  P.pos.set(-10,0,8);ST.yaw=-.6;
  loop();
}
$('bPlay').onclick=()=>{if($('bPlay').classList.contains('off'))return;sfx.init();sfx.coin();ST.started=true;$('start').classList.add('hide');$('hud').classList.remove('hide');P.pos.set(-4,0,10);ST.yaw=0;updateHUD()};
boot();
</script>
