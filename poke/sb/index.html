let AUTO=false;try{AUTO=QS.get('auto')==='1'||(QS.get('auto')!=='0'&&localStorage.getItem('sb-auto')==='1');}catch(e){}
let _av=[0,0];
function autoVec(){
  const p=S.p,sp=p.sp;let cxs=0,cys=0,cn=0;
  for(const e of S.en){if(e.dead)continue;if(Math.abs(e.x-p.x)<420&&Math.abs(e.y-p.y)<420){cxs+=e.x;cys+=e.y;cn++;}}
  const cx=cn?cxs/cn:p.x,cy=cn?cys/cn:p.y;
  let tg=null,td=1e9;                                   // 주울 것: 금화·영혼(kind) 먼저, 그다음 경험치 구슬 · 피가 모자라면 회복
  for(const g of S.gem){const d=Math.hypot(g.x-p.x,g.y-p.y)-(g.kind?160:0);if(d<td&&d<520){td=d;tg=g;}}
  if(p.hp<p.max*.6)for(const h of S.drop){const d=Math.hypot(h.x-p.x,h.y-p.y)-120;if(d<td){td=d;tg=h;}}
  let bt=null,btd=1e9;if(S.pm&&p.hp>p.max*.45)for(const e of S.en){if(e.dead||!e.boss)continue;const d=Math.hypot(e.x-p.x,e.y-p.y);if(d<btd){btd=d;bt=e;}}   // 파티가 있으면 보스 쪽으로 가서 같이 싸워요
  let best=0,bs=-1e18;
  for(let i=0;i<16;i++){
    const a=i*Math.PI/8,dx=Math.cos(a),dy=Math.sin(a),qx=p.x+dx*sp*.55,qy=p.y+dy*sp*.55;let sc=0;
    for(const e of S.en){if(e.dead)continue;const ex=e.x-qx,ey=e.y-qy;if(ex>300||ex<-300||ey>300||ey<-300)continue;
      const d=Math.hypot(ex,ey),R=e.rad+((e.boss||e.wb)?120:64);
      if(d<R)sc-=(R-d)*(R-d)/R*(e.dmg>=25?1.7:1)*(S.pm?.4:1);}
    if(bt){const d0=Math.hypot(bt.x-p.x,bt.y-p.y),d1=Math.hypot(bt.x-qx,bt.y-qy);sc+=(Math.abs(d0-220)-Math.abs(d1-220))*1.4;}
    if(tg){const d0=Math.hypot(tg.x-p.x,tg.y-p.y),d1=Math.hypot(tg.x-qx,tg.y-qy);sc+=(d0-d1)*(tg.kind?1.6:.9)*(p.hp<p.max*.35?.3:1);}
    if(cn)sc+=(Math.hypot(qx-cx,qy-cy)-Math.hypot(p.x-cx,p.y-cy))*.35;
    sc+=(dx*_av[0]+dy*_av[1])*5;
    if(sc>bs){bs=sc;best=a;}}
  _av=[Math.cos(best),Math.sin(best)];return _av;
}
function inputVec(){
  let x=0,y=0;
  if(keys['a']||keys['arrowleft'])x--; if(keys['d']||keys['arrowright'])x++;
  if(keys['w']||keys['arrowup'])y--;   if(keys['s']||keys['arrowdown'])y++;
  if(touch){const dx=touch.x-touch.sx,dy=touch.y-touch.sy,d=Math.hypot(dx,dy);if(d>8){x=dx/Math.max(d,50);y=dy/Math.max(d,50);}}
  if(AUTO&&S&&!S.over&&!x&&!y&&!touch)return autoVec();
  const m=Math.hypot(x,y); if(m>1){x/=m;y/=m;}
  return [x,y];
}

function tierIdx(t){let r=0;TIERS.forEach((k,i)=>{if(t>=k.t)r=i;});return r;}
function sliceRange(ti){const N=SORT.length;const lo=Math.floor(ti*.17*N),hi=Math.max(lo+1,Math.floor((ti+1)*.17*N));return [lo,hi];}
function randIn(lo,hi){return SORT[lo+Math.floor(Math.random()*(hi-lo))];}
function pickEnemyA(ti){const [lo,hi]=sliceRange(ti);for(let i=0;i<12;i++){const A=randIn(lo,hi);if(A.ok)return A;need(A);}return null;}
function pickBossA(){const N=SORT.length,lo=Math.floor(N*.85);for(let i=0;i<12;i++){const A=randIn(lo,N);if(A.ok)return A;need(A);}for(let i=N-1;i>=0;i--)if(SORT[i].ok)return SORT[i];return null;}
function prefetch(ti){for(let k=ti;k<=Math.min(4,ti+1);k++){const [lo,hi]=sliceRange(k);for(let i=0;i<4;i++)need(randIn(lo,hi));}
  const N=SORT.length;for(let i=0;i<2;i++)need(randIn(Math.floor(N*.85),N));}

function bossHp(idx){const base=400*(1+idx*1.2)*HMUL;if(!S.pm||!S.pdps)return base;
  return Math.max(base,S.pdps*PCFG.bossEff*PCFG.bossSec[Math.min(1,idx)]*(1+DTIER*.12));}
/* 일일보스 체력 = 내 파티 화력 × 버티는 시간 (난이도 쉬움 36초 → 명계 63초, 난이도 배율 ×1.0 → ×1.9 · DB_SEC / DB_MUL 숫자로 조절) */
const DB_SEC=36+DTIER*3, DB_MUL=1+DTIER*.1;
function dailyBossHp(){const base=4500*HMUL;if(!S.pm||!S.pdps)return base;return Math.max(base,Math.round(S.pdps*PCFG.bossEff*DB_SEC*DB_MUL));}
function spawnEnemy(boss){
  const p=S.p, ang=Math.random()*Math.PI*2, r=Math.hypot(W,H)/2+30;
  const ti=tierIdx(S.t*TF),tr=TIERS[ti],grow=1+S.t*TF/300;let e;
  if(boss==='wb'){
    const a=pickBossA();if(!a)return false;const hp=dailyBossHp();S.bmax=hp;
    e={a,x:p.x+Math.cos(ang)*r*.8,y:p.y+Math.sin(ang)*r*.8,hp,max:hp,sp:38,dmg:Math.max(Math.round(28*DMUL),S.pm?Math.round(S.p.max*.035*(1+DTIER*.15)):0),xp:60,rad:46,sc:SC*3,boss:1,wb:1,dir:0,hit:0,seed:Math.random()*4};
  } else if(boss!==undefined){
    const a=pickBossA();if(!a)return false;const hp=bossHp(boss),rr=Math.min(W,H)*.5+110;
    e={a,x:p.x+Math.cos(ang)*rr,y:p.y+Math.sin(ang)*rr,hp,max:hp,sp:46,dmg:Math.round(25*DMUL),xp:40,rad:46,sc:SC*(3.2+boss*.6),boss:1,bi:boss,dir:0,hit:0,seed:Math.random()*4};
  } else {
    if(GOAL&&(S.spn|0)>=GOAL)return false;
    const a=pickEnemyA(ti);if(!a)return false;const hp=tr.hp*grow*HMUL*mobPW();S.spn=(S.spn|0)+1;
    e={a,x:p.x+Math.cos(ang)*r,y:p.y+Math.sin(ang)*r,hp,max:hp,sp:tr.sp*(0.85+Math.random()*.3),dmg:Math.max(1,Math.round(tr.dmg*DMUL),S.pm?Math.round(S.p.max*PCFG.mobDmgPct*(1+DTIER*.25)):0),xp:tr.xp,rad:12,sc:SC,dir:0,hit:0,seed:Math.random()*4};
  }
  S.en.push(e);return true;
}
function fmtN(n){n=Math.round(n);return n>=1e8?(n/1e8).toFixed(1)+'억':n>=1e4?(n/1e4).toFixed(n>=1e5?0:1)+'만':String(n);}
function hurtEnemy(e,d,kx,ky){
  if(e.wb)S.bdmg+=Math.min(d,Math.max(0,e.hp));
  e.hp-=d; e.hit=.12; if(kx!==undefined){const kk=e.boss?.08:1;e.x+=kx*kk;e.y+=ky*kk;}
  if(S.fx.length<90)S.fx.push({x:e.x,y:e.y-20,txt:fmtN(d),life:.5});
  if(e.hp<=0&&!e.dead){
    e.dead=1;S.kills++;
    S.gem.push({x:e.x,y:e.y,v:e.xp*(MODE?1.5:1),big:e.boss?1:0,ex:1});
    if(MODE==='gold'||MODE==='soul'){const n=e.boss?PCFG.bossGem:(Math.random()<(MODE==='gold'?.55:.45)?1:0);for(let i=0;i<n;i++)S.gem.push({x:e.x+(Math.random()-.5)*50,y:e.y+(Math.random()-.5)*50,v:0,kind:MODE});}
    if(e.wb){S.wbDead=1;sfxT('ko',.5);}
    if(e.boss&&!e.wb){S.bk++;S.ban={txt:'👑 BOSS 처치!',t:2.2,c:'#ffd84a'};S.shake=.5;sfxT('ko',.5);}
    if(e.boss){for(let i=0;i<6;i++)S.gem.push({x:e.x+(Math.random()-.5)*60,y:e.y+(Math.random()-.5)*60,v:8,big:1});S.drop.push({x:e.x,y:e.y});}
    else if(Math.random()<.015)S.drop.push({x:e.x,y:e.y});
  }
}

/* ───────── 무기 ───────── */
function nearest(n){
  const p=S.p;const arr=S.en.filter(e=>!e.dead&&Math.hypot(e.x-p.x,e.y-p.y)<420);
  arr.sort((a,b)=>Math.hypot(a.x-p.x,a.y-p.y)-Math.hypot(b.x-p.x,b.y-p.y));return arr.slice(0,n);
}
function inView(){const p=S.p;return S.en.filter(e=>!e.dead&&Math.abs(e.x-p.x)<W/2&&Math.abs(e.y-p.y)<H/2);}
function aoe(x,y,r,d,kb){for(const e of S.en){const dd=Math.hypot(e.x-x,e.y-y);if(!e.dead&&dd<r+e.rad){const a=Math.atan2(e.y-y,e.x-x);hurtEnemy(e,d,Math.cos(a)*(kb||0),Math.sin(a)*(kb||0));}}}

function updateWeapons(dt){
  const p=S.p,w=S.wp;
  w.bolt.cd-=dt;
  if(w.bolt.cd<=0){
    const n=1+Math.floor((w.bolt.lv-1)/2), tg=nearest(n);
    w.bolt.cd=Math.max(.35,1.0-0.08*w.bolt.lv);
    tg.forEach(e=>{const a=Math.atan2(e.y-p.y,e.x-p.x);S.pr.push({x:p.x,y:p.y-14,vx:Math.cos(a)*320,vy:Math.sin(a)*320,d:(7+w.bolt.lv*2)*p.dmg,life:1.4,pierce:1+(w.bolt.lv>=4?1:0),hits:new Set()});});
  }
  if(w.spread.lv>0){w.spread.cd-=dt;if(w.spread.cd<=0){const t=nearest(1)[0];w.spread.cd=Math.max(.8,1.7-.12*w.spread.lv);
    if(t){const base=Math.atan2(t.y-p.y,t.x-p.x),n=3+Math.floor(w.spread.lv/2);for(let i=0;i<n;i++){const a=base+(i-(n-1)/2)*.2;S.pr.push({x:p.x,y:p.y-14,vx:Math.cos(a)*300,vy:Math.sin(a)*300,d:(4+w.spread.lv*1.5)*p.dmg,life:.7,pierce:1,hits:new Set(),c:'255,140,60'});}}}}
  if(w.boom.lv>0){w.boom.cd-=dt;if(w.boom.cd<=0){w.boom.cd=Math.max(1.2,2.6-.2*w.boom.lv);const n=1+Math.floor(w.boom.lv/3),tg=nearest(n);
    for(let i=0;i<n;i++){const t=tg[i]||tg[0];const a=t?Math.atan2(t.y-p.y,t.x-p.x):Math.random()*6.28;S.pr.push({x:p.x,y:p.y-14,vx:Math.cos(a)*360,vy:Math.sin(a)*360,d:(8+w.boom.lv*2.5)*p.dmg,life:4,pierce:999,hits:new Set(),boom:1,r:11,c:'120,255,160'});}}}
  if(w.thunder.lv>0){w.thunder.cd-=dt;if(w.thunder.cd<=0){w.thunder.cd=Math.max(.9,2.4-.2*w.thunder.lv);const n=1+Math.floor((w.thunder.lv+1)/2);
    const c=inView();for(let i=0;i<n&&c.length;i++){const e=c.splice(Math.floor(Math.random()*c.length),1)[0];hurtEnemy(e,(14+w.thunder.lv*4)*p.dmg);S.fx.push({bolt:1,x:e.x,y:e.y,life:.25,max:.25});}}}
  if(w.fire.lv>0){w.fire.cd-=dt;if(w.fire.cd<=0){w.fire.cd=Math.max(2.2,4.6-.4*w.fire.lv);const t=nearest(1)[0];
    const x=t?t.x:p.x+(Math.random()-.5)*160,y=t?t.y:p.y+(Math.random()-.5)*160;S.zones.push({x,y,r:40+w.fire.lv*5,life:3+w.fire.lv*.3,tk:0,d:4+w.fire.lv*1.5});}}
  if(w.frost.lv>0){w.frost.cd-=dt;if(w.frost.cd<=0){w.frost.cd=Math.max(1.5,3.2-.2*w.frost.lv);const n=4+w.frost.lv,off=Math.random()*6.28;
    for(let i=0;i<n;i++){const a=off+i*Math.PI*2/n;S.pr.push({x:p.x,y:p.y-14,vx:Math.cos(a)*220,vy:Math.sin(a)*220,d:(6+w.frost.lv*2)*p.dmg,life:1.1,pierce:2,hits:new Set(),slow:1,c:'120,200,255'});}}}
  if(w.orbit.lv>0){
    w.orbit.ang+=dt*(2.4+w.orbit.lv*.2);
    const n=1+w.orbit.lv, R=56+w.orbit.lv*4;
    for(let i=0;i<n;i++){
      const a=w.orbit.ang+i*Math.PI*2/n, ox=p.x+Math.cos(a)*R, oy=p.y-12+Math.sin(a)*R;
      for(const e of S.en){ if(e.dead)continue; if(Math.hypot(e.x-ox,e.y-12-oy)<e.rad+10){ if(!e.oh||e.oh<S.t){e.oh=S.t+.4;hurtEnemy(e,(5+w.orbit.lv*2)*p.dmg);} } }
    }
  }
  if(w.pulse.lv>0){
    w.pulse.cd-=dt;
    if(w.pulse.cd<=0){
      w.pulse.cd=Math.max(1.6,4.2-w.pulse.lv*.35);
      const R=90+w.pulse.lv*18;
      S.fx.push({x:p.x,y:p.y-10,ring:R,life:.45,max:.45});
      aoe(p.x,p.y,R,(12+w.pulse.lv*4)*p.dmg,14);
    }
  }
}

/* 에셋 스킬 (이펙트 시트 1개 = 스킬 1개) */
function updateSkills(dt){
  const p=S.p;
  S.sk.forEach((s,si)=>{
    const K=s.K,L=s.lv,pw=K.pw;
    if(K.arch===4){ // 회전
      s.ang=(s.ang||0)+dt*(2+.15*L);const n=1+Math.ceil(L/2),R=58+L*4+(si%3)*16;s.pos=[];
      for(let i=0;i<n;i++){const a=s.ang+i*Math.PI*2/n,ox=p.x+Math.cos(a)*R,oy=p.y-12+Math.sin(a)*R;s.pos.push([ox,oy]);
        for(const e of S.en){if(e.dead)continue;if(Math.hypot(e.x-ox,e.y-12-oy)<e.rad+K.fw*K.sc*.4){e.oh2=e.oh2||{};if(!(e.oh2[K.id]>S.t)){e.oh2[K.id]=S.t+.45;hurtEnemy(e,(4+L*1.6)*pw*p.dmg);}}}}
      return;
    }
    s.cd=(s.cd||0)-dt;if(s.cd>0)return;
    switch(K.arch){
      case 0:{s.cd=Math.max(.5,1.4-.08*L);const n=1+Math.floor(L/3);nearest(n).forEach(e=>{const a=Math.atan2(e.y-p.y,e.x-p.x);S.pr.push({x:p.x,y:p.y-14,vx:Math.cos(a)*300,vy:Math.sin(a)*300,d:(7+L*2.5)*pw*p.dmg,life:1.5,pierce:1+Math.floor(L/4),hits:new Set(),K});});break;}
      case 1:{s.cd=Math.max(.9,1.8-.1*L);const t=nearest(1)[0];if(t){const base=Math.atan2(t.y-p.y,t.x-p.x),n=3+Math.floor(L/2);for(let i=0;i<n;i++){const a=base+(i-(n-1)/2)*.22;S.pr.push({x:p.x,y:p.y-14,vx:Math.cos(a)*280,vy:Math.sin(a)*280,d:(4+L*1.5)*pw*p.dmg,life:.85,pierce:1,hits:new Set(),K});}}break;}
      case 2:{s.cd=Math.max(1,2.4-.18*L);const n=1+Math.floor(L/3),c=inView();for(let i=0;i<n&&c.length;i++){const e=c.splice(Math.floor(Math.random()*c.length),1)[0];S.fxs.push({K,x:e.x,y:e.y-8,t:0,dur:Math.max(.35,K.n/14),r:34+L*3,d:(12+L*3.5)*pw*p.dmg,sc:Math.max(K.sc,(34+L*3)*2/Math.max(K.fw,K.h)*.8)});}break;}
      case 3:{s.cd=Math.max(1.8,4-.3*L);const R=70+L*14;S.fxs.push({K,x:p.x,y:p.y-10,t:0,dur:Math.max(.6,K.n/14),r:R,d:(10+L*3.5)*pw*p.dmg,sc:R*2/Math.max(K.fw,K.h),follow:1,grow:1,kb:16});break;}
      case 5:{s.cd=Math.max(1.2,2.6-.2*L);const n=1+Math.floor(L/3),tg=nearest(n);for(let i=0;i<n;i++){const t=tg[i]||tg[0];const a=t?Math.atan2(t.y-p.y,t.x-p.x):Math.random()*6.28;S.pr.push({x:p.x,y:p.y-14,vx:Math.cos(a)*360,vy:Math.sin(a)*360,d:(8+L*2.5)*pw*p.dmg,life:4,pierce:999,hits:new Set(),boom:1,K});}break;}
      case 6:{s.cd=Math.max(2.5,5-.4*L);const t=nearest(1)[0];const x=t?t.x:p.x+(Math.random()-.5)*160,y=t?t.y:p.y+(Math.random()-.5)*160;S.zones.push({x,y,r:38+L*5,life:3+.3*L,tk:0,d:(3.5+L*1.4)*pw,K});break;}
      case 7:{s.cd=Math.max(.9,2.6-.2*L);const n=2+L,c=inView();for(let i=0;i<n&&c.length;i++){const e=c.splice(Math.floor(Math.random()*c.length),1)[0];S.fxs.push({K,x:e.x,y:e.y-8,t:-i*.08,dur:Math.max(.3,K.n/16),r:26,d:(6+L*2)*pw*p.dmg,sc:Math.max(K.sc,52/Math.max(K.fw,K.h))});}break;}
    }
  });
}

const OURW=['chain','wave','solar','quake','rock','hyper'];
function beamShot(len,wd,dmg,c){
  const p=S.p,t=nearest(1)[0];if(!t)return false;
  const a=Math.atan2(t.y-p.y,t.x-p.x),dx=Math.cos(a),dy=Math.sin(a),sx=p.x,sy=p.y-12;
  for(const e of S.en){if(e.dead)continue;const rx=e.x-sx,ry=(e.y-12)-sy,pr=rx*dx+ry*dy;if(pr<0||pr>len)continue;
    if(Math.abs(rx*dy-ry*dx)<wd/2+e.rad)hurtEnemy(e,dmg*p.dmg,dx*6,dy*6);}
  S.bm.push({pts:[[sx,sy],[sx+dx*len,sy+dy*len]],life:.4,max:.4,c,w:wd});return true;
}
function updateOurWeapons(dt){
  const p=S.p,w=S.wp;
  const T=(k,cd,f)=>{const o=w[k];if(o.lv<=0)return;o.cd-=dt;if(o.cd<=0){o.cd=cd(o.lv);f(o.lv);}};
  T('chain',L=>Math.max(1,2.2-.15*L),L=>{
    let cur=nearest(1)[0];if(!cur)return;const hit=new Set([cur]),n=2+L,pts=[[p.x,p.y-14]];
    for(let i=0;i<n&&cur;i++){hurtEnemy(cur,(9+L*3)*p.dmg);pts.push([cur.x,cur.y-12]);
      let nx=null,bd=170;for(const e of S.en){if(e.dead||hit.has(e))continue;const d=Math.hypot(e.x-cur.x,e.y-cur.y);if(d<bd){bd=d;nx=e;}}
      if(nx)hit.add(nx);cur=nx;}
    S.bm.push({pts,life:.3,max:.3,c:'255,236,90',w:4,zig:1});sfxT('zap');});
  T('wave',L=>Math.max(1.6,3.4-.2*L),L=>{
    const t=nearest(1)[0],a=t?Math.atan2(t.y-p.y,t.x-p.x):Math.random()*6.28;
    S.pr.push({x:p.x,y:p.y-8,vx:Math.cos(a)*250,vy:Math.sin(a)*250,d:(7+L*2.5)*p.dmg,life:1.3,pierce:999,hits:new Set(),c:'70,170,255',r:26+L*3,hr:30+L*3});sfxT('splash');});
  T('solar',L=>Math.max(1.8,3.8-.25*L),L=>{if(beamShot(380,22+L*2,14+L*5,'150,255,120'))sfxT('beam_charge',.3);});
  T('hyper',L=>Math.max(3.5,7-.4*L),L=>{if(beamShot(520,46+L*3,40+L*14,'255,170,60')){sfxT('explosion',.4);S.shake=.25;}});
  T('quake',L=>Math.max(2.6,5.5-.35*L),L=>{S.bx.push({x:p.x,y:p.y,t:0,dur:.7,r:110+L*14,d:(11+L*4)*p.dmg,c:'200,150,90',kb:18,follow:1});S.shake=.35;sfxT('quake',.45);});
  T('rock',L=>Math.max(1.1,2.6-.18*L),L=>{const n=2+Math.floor(L/2),c=inView();
    for(let i=0;i<n&&c.length;i++){const e=c.splice(Math.floor(Math.random()*c.length),1)[0];S.bx.push({x:e.x,y:e.y,t:-i*.1,dur:.5,r:30+L*2,d:(11+L*3.5)*p.dmg,c:'180,150,120',rock:1});}
    sfxT('rock',.3);});
}

function initParty(){

const AWC=['#9a4dff','#3d8bff','#2fd37a','#ffc933','#ff4d3a','#ff6adf','#00d4ff','#b0ff3d','#ff8a1a','#ffffff'];

    ctx.strokeStyle=`rgba(255,255,255,${a})`;ctx.lineWidth=4*a+1.5;ctx.beginPath();ctx.arc(q.x,q.y,q.r*(.5+.5*k),q.a-1.05,q.a+1.05);ctx.stroke();
    const cx2=Math.cos(q.a),cy2=Math.sin(q.a),px2=-cy2,py2=cx2,L2=q.r*(.6+.5*k);
    ctx.strokeStyle=`rgba(255,255,255,${a*.9})`;ctx.lineWidth=3*a+1;ctx.beginPath();ctx.moveTo(q.x+cx2*q.r*.5-px2*L2*.6,q.y+cy2*q.r*.5-py2*L2*.6);ctx.lineTo(q.x+cx2*q.r*.5+px2*L2*.6,q.y+cy2*q.r*.5+py2*L2*.6);ctx.stroke();}
  for(const b of S.bm){const a=b.life/b.max;ctx.lineCap='round';ctx.lineJoin='round';
    const path=()=>{ctx.beginPath();b.pts.forEach((q,i)=>{const x=q[0]+(b.zig&&i?(Math.random()-.5)*10:0),y=q[1]+(b.zig&&i?(Math.random()-.5)*10:0);i?ctx.lineTo(x,y):ctx.moveTo(x,y);});};
    ctx.strokeStyle=`rgba(${b.c},${a*.55})`;ctx.lineWidth=b.w*(.6+.6*a);path();ctx.stroke();
    ctx.strokeStyle=`rgba(255,255,255,${a})`;ctx.lineWidth=Math.max(2,b.w*.35*a);path();ctx.stroke();}
  for(const f of S.fxs){if(f.t<0)continue;const k=f.t/f.dur,fr=Math.min(f.K.n-1,Math.floor(k*f.K.n));const sc=f.grow?f.sc*(.4+.6*Math.min(1,k*1.5)):f.sc;drawStrip(ctx,f.K,fr,f.x,f.y,sc,1-Math.max(0,k-.8)*5);}
  for(const b of S.pr){
    if(b.K){drawStrip(ctx,b.K,sfr(b.K,b.t),b.x,b.y,b.K.sc);continue;}
    const c=b.c||'255,216,74',r=b.r||9;const gr=ctx.createRadialGradient(b.x,b.y,1,b.x,b.y,r);gr.addColorStop(0,'#fff');gr.addColorStop(.5,`rgb(${c})`);gr.addColorStop(1,`rgba(${c},0)`);ctx.fillStyle=gr;ctx.beginPath();ctx.arc(b.x,b.y,r,0,7);ctx.fill();}
  ctx.textAlign='center';
  for(const f of S.fx){
    if(f.bolt){ctx.strokeStyle=`rgba(200,225,255,${f.life/f.max})`;ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(f.x,f.y-300);for(let i=1;i<=6;i++)ctx.lineTo(i<6?f.x+(Math.random()-.5)*30:f.x,f.y-300+i*50);ctx.stroke();continue;}
    if(f.ring){const k=1-f.life/f.max;ctx.strokeStyle=`rgba(255,255,255,${1-k})`;ctx.lineWidth=4;ctx.beginPath();ctx.arc(f.x,f.y,f.ring*k,0,7);ctx.stroke();continue;}
    ctx.font=`bold ${f.big?28:f.mvn?12:13}px system-ui`;ctx.fillStyle=f.c||(f.hurt?'#ff6a5a':f.heal?'#7dff8a':f.big?'#ffd84a':'#fff');ctx.strokeStyle='#000';ctx.lineWidth=3;
    const y=f.y-(1-f.life/(f.big?2:.5))*18;ctx.strokeText(f.txt,f.x,y);ctx.fillText(f.txt,f.x,y);
  }
  ctx.restore();
  if(touch){ctx.strokeStyle='#fff6';ctx.lineWidth=3;ctx.beginPath();ctx.arc(touch.sx,touch.sy,44,0,7);ctx.stroke();
    const dx=touch.x-touch.sx,dy=touch.y-touch.sy,d=Math.min(44,Math.hypot(dx,dy)),a=Math.atan2(dy,dx);ctx.fillStyle='#fff8';ctx.beginPath();ctx.arc(touch.sx+Math.cos(a)*d,touch.sy+Math.sin(a)*d,18,0,7);ctx.fill();}
  ctx.fillStyle='#0008';ctx.fillRect(0,0,W,22);
  ctx.fillStyle='#4ac8ff';ctx.fillRect(0,0,W*Math.min(1,S.xp/S.need),8);
  ctx.fillStyle='#fff';ctx.font='bold 13px system-ui';ctx.textAlign='left';ctx.fillText(`Lv ${S.lv}`,8,19);
  ctx.textAlign='center';const tt=MODE?Math.max(0,WIN_TIME-S.t):S.t,m=Math.floor(tt/60),s=Math.floor(tt%60).toString().padStart(2,'0');ctx.fillText(`${m}:${s}`,W/2,19);
  ctx.textAlign='right';ctx.fillText(`처치 ${S.kills}`+(GOAL?'/'+(GOAL+BOSS_TIMES.length):''),W-8,19);
  ctx.textAlign='left';ctx.font='bold 11px system-ui';ctx.fillStyle='#fffc';ctx.fillText(`무기 ${wcount()}/${MAX_W}`+(S.pm?` · 파티 ${S.pm.length}마리`:''),8,36);
  if(MODE){ctx.textAlign='right';ctx.font='bold 12px system-ui';ctx.fillStyle=MODE_INFO[MODE][1];ctx.fillText(MODE_INFO[MODE][0]+' · '+TNAME[DTIER],W-8,36);
    if(MODE!=='boss'){ctx.fillStyle='#fff';ctx.fillText((MODE==='gold'?'💰 ':MODE==='soul'?'👻 ':'🧪 ')+S.got,W-8,52);}
    else{const be=S.en.find(e=>e.wb);if(be){const bw2=Math.min(420,W*.8);ctx.fillStyle='#000a';ctx.fillRect(W/2-bw2/2,28,bw2,12);ctx.fillStyle='#ff6a5a';ctx.fillRect(W/2-bw2/2+2,30,(bw2-4)*Math.max(0,be.hp/be.max),8);}
      ctx.fillStyle='#fff';ctx.fillText('피해 '+Math.round(S.bdmg).toLocaleString(),W-8,52);}}
  const bo=S.en.find(e=>e.boss&&!e.wb&&!e.dead);
  if(bo){const bw4=Math.min(420,W*.86),bx4=W/2-bw4/2;ctx.fillStyle='#000b';ctx.fillRect(bx4,62,bw4,16);ctx.fillStyle='#e5482f';ctx.fillRect(bx4+2,64,(bw4-4)*Math.max(0,bo.hp/bo.max),12);
    ctx.strokeStyle='#fff8';ctx.lineWidth=1;ctx.strokeRect(bx4+.5,62.5,bw4-1,15);ctx.fillStyle='#fff';ctx.font='bold 11px system-ui';ctx.textAlign='center';
    ctx.fillText('👑 BOSS '+(((bo.bi|0)+1))+'  '+Math.max(0,Math.ceil(bo.hp/bo.max*100))+'%',W/2,75);}
  if(S.ban){const a=Math.min(1,S.ban.t/.5),k=1+Math.max(0,S.ban.t-2)*.5;ctx.save();ctx.globalAlpha=a;ctx.textAlign='center';ctx.font=`bold ${Math.round(Math.min(40,W*.09)*k)}px system-ui`;
    ctx.lineWidth=6;ctx.strokeStyle='#000';ctx.strokeText(S.ban.txt,W/2,H*.3);ctx.fillStyle=S.ban.c;ctx.fillText(S.ban.txt,W/2,H*.3);ctx.restore();}
  const bw=Math.min(220,W*.5);ctx.fillStyle='#0009';ctx.fillRect(W/2-bw/2,H-30,bw,14);ctx.fillStyle='#e5482f';ctx.fillRect(W/2-bw/2+2,H-28,(bw-4)*Math.max(0,p.hp/p.max),10);
  ctx.fillStyle='#fff';ctx.font='bold 11px system-ui';ctx.textAlign='center';ctx.fillText(`${Math.max(0,Math.ceil(p.hp))} / ${p.max}`,W/2,H-19);
}

/* ───────── 메인 루프 ───────── */
function loop(now){
  const dt=Math.min(.05,(now-last)/1000);last=now;
  if(S){if(!paused)update(dt);render();}
  requestAnimationFrame(loop);
}
/* 캐릭터 선택: 전부 나열 (보이는 것만 불러옴) */
function buildPick(){
  const box=document.getElementById('pick');box.innerHTML='';
  document.getElementById('cnt').textContent=`(${WALK.length}종)`;
  const io=new IntersectionObserver(es=>{es.forEach(en=>{if(!en.isIntersecting)return;const d=en.target;io.unobserve(d);const A=WALK[+d.dataset.i];
    loadP(A).then(()=>{if(!A.ok)return;const cc=document.createElement('canvas');cc.width=A.cw;cc.height=A.ch;cc.getContext('2d').drawImage(A.img,0,0,A.cw,A.ch,0,0,A.cw,A.ch);
      const sc=Math.min(2,64/Math.max(A.cw,A.ch));cc.style.width=A.cw*sc+'px';cc.style.height=A.ch*sc+'px';d.appendChild(cc);});});},{root:box,rootMargin:'200px'});
  WALK.forEach((A,i)=>{const d=document.createElement('div');d.className='pc'+(i===chosen?' sel':'');d.dataset.i=i;
    d.onclick=()=>{chosen=i;const old=box.querySelector('.sel');if(old)old.classList.remove('sel');d.classList.add('sel');};box.appendChild(d);io.observe(d);});
}
async function start(){
  const go=document.getElementById('go');go.disabled=true;go.textContent='불러오는 중...';
  const A=WALK[chosen],ps=[loadP(A)];
  for(let ti=0;ti<2;ti++){const [lo,hi]=sliceRange(ti);for(let i=0;i<10;i++)ps.push(loadP(randIn(lo,hi)));}
  const N=SORT.length;for(let i=0;i<3;i++)ps.push(loadP(randIn(Math.floor(N*.85),N)));
  await Promise.all(ps);
  go.disabled=false;go.textContent='시작';
  document.getElementById('start').classList.add('hide');document.getElementById('end').classList.add('hide');
  newGame(A);paused=false;last=performance.now();playBgm();
}
document.getElementById('go').onclick=start;
document.getElementById('rnd').onclick=()=>{chosen=Math.floor(Math.random()*WALK.length);start();};
document.getElementById('again').onclick=()=>{document.getElementById('end').classList.add('hide');document.getElementById('start').classList.remove('hide');paused=true;S=null;};
const sndBtn=document.getElementById('snd');
sndBtn.textContent=SND?'🔊':'🔇';
sndBtn.onclick=()=>{SND=!SND;try{localStorage.setItem('sb-snd',SND?'1':'0');}catch(e){}sndBtn.textContent=SND?'🔊':'🔇';if(SND)playBgm();else if(bgm)bgm.pause();};
sndBtn.addEventListener('pointerdown',e=>e.stopPropagation());
const autoBtn=document.getElementById('auto');
const autoTxt=()=>{autoBtn.textContent=AUTO?'🤖 자동 켜짐':'🤖 자동 꺼짐';autoBtn.style.background=AUTO?'#2f9e44':''};
autoTxt();
autoBtn.onclick=()=>{AUTO=!AUTO;try{localStorage.setItem('sb-auto',AUTO?'1':'0');}catch(e){}autoTxt();
  if(AUTO&&!document.getElementById('lvl').classList.contains('hide')){const c=document.querySelector('#opts .card');if(c)c.click();}};
autoBtn.addEventListener('pointerdown',e=>e.stopPropagation());
addEventListener('message',e=>{const d=e.data;if(d&&d.cmd==='quit'&&S&&!S.over)finish(false,'quit');else if(d&&d.cmd==='quit'&&!S)postResult({sb:1,mode:MODE,tier:DTIER,r:2,kills:0,got:0,t:0,lv:1,bdmg:0,bmax:0});});
if(MODE){document.getElementById('start').classList.add('hide');chosen=+QS.get('hero')>=0&&QS.get('hero')!==null&&QS.get('hero')!==''?(+QS.get('hero')%WALK.length):Math.floor(Math.random()*WALK.length);}
buildPick();requestAnimationFrame(t=>{last=t;loop(t);});
if(MODE)start();
</script>
