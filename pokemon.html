#bAuto{border:3px solid #2c3050;border-radius:12px;background:#ffd23f;font-weight:900;font-size:15px;padding:0 12px;color:#2c3050;box-shadow:0 3px 0 #2c3050}#bAuto.on{background:#7dff8a}
#hHunt{position:fixed;left:10px;top:calc(84px + env(safe-area-inset-top));z-index:5;color:#fff;font-weight:900;font-size:13px;text-shadow:0 1px 3px #000;pointer-events:none}

#pad button{position:absolute;width:58px;height:58px;border-radius:14px;border:3px solid #2c3050;background:#fffdf0d8;font-size:24px;color:#2c3050;box-shadow:0 3px 0 #2c3050;touch-action:none}#pad button.on{background:#ffd23f}

.hp{height:10px;background:#4a4f5c;border-radius:6px;margin-top:5px;overflow:hidden;border:2px solid #3a3a48}.hp i{display:block;height:100%;border-radius:4px;background:#3be06a;transition:width .3s}
.hpn{text-align:right;font-size:12px;font-weight:800;margin-top:2px}.ex{height:5px;background:#ccd;border-radius:3px;margin-top:3px;overflow:hidden}.ex i{display:block;height:100%;background:#4aa8ff}

#bMenu .mf{background:#ff7a5a;color:#fff}

// ===== 내 캐릭터 묶음 (선생님 기기 안에만 저장 · 인터넷에 안 올라감) =====
// ZIP 을 통째로 넣으면 안에서 쓸 수 있는 걸 알아서 찾아요:
//  · 베드락 3D 모델: *.geo.json + 같은 이름 *.png (코블몬 리소스팩 등)
//  · 3D 모델: *.glb
//  · 사람 모양 스킨: 64×64 / 64×32 / 128×128 사람 스킨 그림 → 마크 캐릭터로
//  · 2D 캐릭터 그림: 몬스터·캐릭터 그림 폴더의 png → 세워 놓은 그림 카드로
const UP=(()=>{let DB=null;const IDX='__index';
function idb(){return DB||(DB=new Promise((res,rej)=>{const r=indexedDB.open('zm-hitlab',1);r.onupgradeneeded=()=>r.result.createObjectStore('m');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)}))}
async function put(k,v){const d=await idb();return new Promise(r=>{const t=d.transaction('m','readwrite');t.objectStore('m').put(v,k);t.oncomplete=r;t.onerror=r})}
async function get(k){try{const d=await idb();return new Promise(r=>{const q=d.transaction('m').objectStore('m').get(k);q.onsuccess=()=>r(q.result||null);q.onerror=()=>r(null)})}catch(e){return null}}
async function del(k){const d=await idb();return new Promise(r=>{const t=d.transaction('m','readwrite');t.objectStore('m').delete(k);t.oncomplete=r})}
async function index(){const L=await get(IDX);if(L)return L;// 예전 방식으로 넣은 것도 목록에
  try{const d=await idb();const ks=await new Promise(r=>{const q=d.transaction('m').objectStore('m').getAllKeys();q.onsuccess=()=>r(q.result||[]);q.onerror=()=>r([])});const out=[];for(const k of ks){if(k===IDX)continue;const v=await get(k);if(v)out.push({n:k,k:v.kind})}await put(IDX,out);return out}catch(e){return[]}}
async function setIndex(L){await put(IDX,L)}
// 넣은 건 처음엔 꺼져 있어요(on:false). 관리자가 켠 것만 게임에 나와요. pk = 어느 ZIP 에서 왔는지
let PK='';async function add(name,rec,L,on){let n=name,i=2;while(L.some(x=>x.n===n))n=name+'_'+(i++);await put(n,rec);L.push({n,k:rec.kind,on:!!on,pk:PK||'낱개 파일'});return n}
async function setOn(names,on){const L=await index();const S=new Set(names);L.forEach(x=>{if(S.has(x.n))x.on=!!on});await setIndex(L)}
async function active(kinds){return (await index()).filter(x=>x.on&&(!kinds||kinds.includes(x.k)))}
async function remove(name){const L=await index();await del(name);await setIndex(L.filter(x=>x.n!==name))}
async function clearAll(){const L=await index();for(const x of L)await del(x.n);await setIndex([])}
// ---------- 그림 검사 ----------
const PNGSZ=u=>u.length>24&&u[0]===0x89&&u[1]===0x50?[(u[16]<<24|u[17]<<16|u[18]<<8|u[19])>>>0,(u[20]<<24|u[21]<<16|u[22]<<8|u[23])>>>0]:null;
// 캔버스로 돌려줘요 (ImageBitmap 은 three 에서 위아래가 안 뒤집혀서 그림이 어긋남)
function bmp(blob){return new Promise((res,rej)=>{const i=new Image();i.onload=()=>{const c=document.createElement('canvas');c.width=i.width;c.height=i.height;c.getContext('2d').drawImage(i,0,0);URL.revokeObjectURL(i.src);res(c)};i.onerror=rej;i.src=URL.createObjectURL(blob)})}
const CV=document.createElement('canvas'),CG=CV.getContext('2d',{willReadFrequently:true});
function cover(img,x,y,w,h,S){CV.width=img.width;CV.height=img.height;CG.clearRect(0,0,CV.width,CV.height);CG.drawImage(img,0,0);const d=CG.getImageData(x*S,y*S,w*S,h*S).data;let n=0;for(let i=3;i<d.length;i+=4)if(d[i]>200)n++;return n/(d.length/4)}
async function isSkin(blob,w,h){if(!((w===64&&(h===64||h===32))||(w===128&&(h===128||h===64))))return false;try{const img=await bmp(blob);const S=w/64;return cover(img,8,8,8,8,S)>.92&&cover(img,20,20,8,12,S)>.85&&cover(img,0,0,8,8,S)<.5}catch(e){return false}}
// 64×32 / 128 스킨 → 64×64 표준 스킨으로
async function normSkin(blob,w,h){const img=await bmp(blob);const c=document.createElement('canvas');c.width=c.height=64;const g=c.getContext('2d');g.imageSmoothingEnabled=false;const S=w/64;
  g.drawImage(img,0,0,w,Math.min(h,64*S),0,0,64,Math.min(h,64*S)/S);
  if(h/S===32){// 옛날 64×32: 왼팔·왼다리를 오른쪽 것으로 복사
    g.drawImage(c,0,16,16,16,16,48,16,16);g.drawImage(c,40,16,16,16,32,48,16,16)}
  return new Promise(r=>c.toBlob(b=>r(b),'image/png'))}
const SPRITE_DIR=/(pokemon|monster|creature|mob|sprite|character|chara|pet|enemy|entity|entities)/i,SKIP_DIR=/(item|icon|gui|\bui\b|font|ribbon|symbol|mark|badge|type|particle|block|terrain|environment|armor|shiny|back|footprint|menu|button)/i;
// ---------- ZIP 넣기 ----------
async function importZip(file,say){say=say||(()=>{});PK=file.name.replace(/\.zip$/i,'');say('ZIP 여는 중… ('+Math.round(file.size/1e6)+'MB)');const buf=new Uint8Array(await file.arrayBuffer());
  let files;try{files=fflate.unzipSync(buf,{filter:f=>/\.(json|png|glb|java)$/i.test(f.name)&&!/__MACOSX/.test(f.name)})}catch(e){say('ZIP을 열 수 없어요: '+e.message);return null}
  const names=Object.keys(files),L=await index(),cnt={bed:0,glb:0,skin:0,spr:0};const base=n=>n.split('/').pop();const stem=n=>base(n).replace(/(\.geo)?\.(json|png|glb)$/i,'').toLowerCase();
  const pngBy=new Map();names.filter(n=>/\.png$/i.test(n)).forEach(n=>{const s=stem(n);if(!pngBy.has(s))pngBy.set(s,[]);pngBy.get(s).push(n)});const used=new Set();let k=0;const GEO=new Set(names.filter(n=>/\.geo\.json$/i.test(n)).map(stem));
  // 0) 베드락 동작(.animation.json): "animation.이름.동작" → 이름별로 모아 둠
  const ANIMS={};for(const n of names.filter(n=>/\.animation\.json$/i.test(n)||(/animations?\//i.test(n)&&/\.json$/i.test(n)))){try{const j=JSON.parse(new TextDecoder().decode(files[n]));const A=j.animations||{};for(const k in A){const m=k.match(/^animation\.([^.]+)\.(.+)$/);if(!m)continue;(ANIMS[m[1].toLowerCase()]||(ANIMS[m[1].toLowerCase()]={}))[m[2]]=A[k]}}catch(e){}}
  const animFor=s=>{const k=s.toLowerCase();if(ANIMS[k])return JSON.stringify(ANIMS[k]);const b=Object.keys(ANIMS).filter(x=>k.startsWith(x)).sort((a,b)=>b.length-a.length)[0];return b?JSON.stringify(ANIMS[b]):null};
  // 0-1) 움직이는 포켓몬(8방향 동작 그림 · .pmd.json) · 기술 이펙트 플립북(.fxanim.json)
  const TD=new TextDecoder();
  for(const n of names.filter(n=>/\.pmd\.json$/i.test(n))){try{const meta=JSON.parse(TD.decode(files[n]));const dir=n.split('/').slice(0,-1).join('/');const sheets={};
      for(const st in meta.anims){const fp=(dir?dir+'/':'')+meta.anims[st].f+'-Anim.png';if(files[fp]){sheets[st]=new Blob([files[fp]],{type:'image/png'});used.add(fp)}}
      if(!sheets.idle)continue;used.add(n);await add(meta.name||meta.key,{kind:'pmd',meta:JSON.stringify(meta),sheets},L);L[L.length-1].t=await pmdThumb(sheets.idle,meta);cnt.pmd=(cnt.pmd||0)+1}catch(e){}
    if(++k%40===0){say('움직이는 포켓몬 '+(cnt.pmd||0)+'마리…');await setIndex(L)}}
  for(const n of names.filter(n=>/\.fxanim\.json$/i.test(n))){try{const meta=JSON.parse(TD.decode(files[n]));const fp=n.replace(/\.fxanim\.json$/i,'.png');if(!files[fp])continue;used.add(fp);used.add(n);
      await add('기술_'+(meta.name||meta.id),{kind:'fxa',meta:JSON.stringify(meta),png:new Blob([files[fp]],{type:'image/png'})},L,true);cnt.fxa=(cnt.fxa||0)+1}catch(e){}}
  // 1) 베드락 모델
  for(const n of names.filter(n=>/\.geo\.json$/i.test(n)||(/\.json$/i.test(n)&&/bedrock|geometry|models\/entity/i.test(n)))){const txt=new TextDecoder().decode(files[n]);if(!/"bones"/.test(txt))continue;
    const s=stem(n);let pn=(pngBy.get(s)||[])[0];if(!pn){const s2=s.replace(/_(male|female|shiny)$/,'');pn=(pngBy.get(s2)||[])[0]}if(!pn){const dir=n.split('/').slice(-2,-1)[0]||'';const dk=dir.replace(/^\d+_/,'');pn=(pngBy.get(dk)||[])[0]}
    if(pn)used.add(pn);const jaP=n.replace(/(\.geo)?\.json$/i,'.javaanim.json');let anS=animFor(s);if(files[jaP]){try{anS=JSON.stringify({__java:JSON.parse(new TextDecoder().decode(files[jaP]))})}catch(e){}}
    await add(s,{kind:'bed',json:txt,png:pn?new Blob([files[pn]],{type:'image/png'}):null,anim:anS},L);cnt.bed++;
    // 같은 모델의 다른 색 텍스처(_shiny 등)는 그 모델에 입혀서 3D로
    if(pn){const dP=pn.split('/').slice(0,-1).join('/'),ps=stem(pn);for(const v of names){if(used.has(v)||!/\.png$/i.test(v)||v.split('/').slice(0,-1).join('/')!==dP)continue;const vs=stem(v);if(!vs.startsWith(ps+'_')||GEO.has(vs))continue;used.add(v);if(/(emissive|glow|_eyes?$|_mask|_overlay|_light|_e$)/.test(vs))continue;await add(vs,{kind:'bed',json:txt,png:new Blob([files[v]],{type:'image/png'}),anim:animFor(s)},L);cnt.bed++}}if(++k%40===0){say('3D 모델 '+cnt.bed+'개…');await setIndex(L)}}
  // 1-2) 자바 모드 모델 코드 (.java 안의 addBox) → 베드락 모델로 바꿔서
  if(typeof JAVAMODEL!=='undefined'){const pngs=names.filter(n=>/\.png$/i.test(n));const jn=names.filter(n=>/\.java$/i.test(n));const texts=jn.map(n=>new TextDecoder().decode(files[n]));const tidx=JAVAMODEL.texIndex(texts);
    for(let q=0;q<jn.length;q++){let R=[];try{R=JAVAMODEL.fromJava(texts[q],jn[q])}catch(e){}
      for(const r of R){const pn=JAVAMODEL.pair(r,pngs,tidx,c=>PNGSZ(files[c]));if(!pn)continue;used.add(pn);
        await add(r.name.toLowerCase(),{kind:'bed',json:JSON.stringify(r.geo),png:new Blob([files[pn]],{type:'image/png'}),anim:r.anim?JSON.stringify({__java:r.anim}):null},L);cnt.bed++;if(++k%40===0){say('자바 모델 '+cnt.bed+'개…');await setIndex(L)}}}}
  // 2) glb
  for(const n of names.filter(n=>/\.glb$/i.test(n))){await add(stem(n),{kind:'glb',data:files[n].buffer.slice(files[n].byteOffset,files[n].byteOffset+files[n].byteLength)},L);cnt.glb++}
  // 2-1) 이펙트 그림: particle · effect · skill · ability · jutsu 폴더의 png → 게임 기술 이펙트로
  for(const n of names.filter(n=>/\.png$/i.test(n)&&!used.has(n)&&/textures\/(particles?|effects?|skills?|abilit|jutsu|fx|projectile)/i.test(n))){const sz=PNGSZ(files[n]);if(!sz||sz[0]<8||sz[0]>512)continue;used.add(n);await add('효과_'+stem(n),{kind:'fx',png:new Blob([files[n]],{type:'image/png'}),w:sz[0],h:sz[1]},L);cnt.fx=(cnt.fx||0)+1}
  // 3) 스킨 · 그림 카드
  const MDIR=new Set([...used].map(x=>x.split('/').slice(0,-1).join('/')));
  for(const n of names.filter(n=>/\.png$/i.test(n)&&!used.has(n)&&!MDIR.has(n.split('/').slice(0,-1).join('/')))){const u=files[n],sz=PNGSZ(u);if(!sz)continue;const [w,h]=sz;const blob=new Blob([u],{type:'image/png'});
    if(await isSkin(blob,w,h)){await add('스킨_'+stem(n),{kind:'skin',png:await normSkin(blob,w,h)},L);cnt.skin++}
    else{const dir=n.split('/').slice(0,-1).join('/');if(SPRITE_DIR.test(dir)&&!SKIP_DIR.test(dir)&&w>=24&&h>=24&&w<=512&&h<=512){await add(stem(n),{kind:'spr',png:blob},L);cnt.spr++}}
    if(++k%60===0){say('찾는 중… 3D '+cnt.bed+' · 스킨 '+cnt.skin+' · 그림 '+cnt.spr);await setIndex(L)}}
  await setIndex(L);say('넣었어요! '+(cnt.pmd?'움직이는 포켓몬 '+cnt.pmd+' · ':'')+(cnt.fxa?'기술 이펙트 '+cnt.fxa+' · ':'')+'3D 모델 '+cnt.bed+' · glb '+cnt.glb+' · 사람 스킨 '+cnt.skin+' · 그림 캐릭터 '+cnt.spr+(cnt.fx?' · 이펙트 그림 '+cnt.fx:''));return cnt}
// 낱개 파일 넣기 (.glb / .geo.json+.png / .png 스킨)
async function importFiles(fs,say){say=say||(()=>{});let last='';const zips=fs.filter(f=>/\.zip$/i.test(f.name));for(const z of zips)await importZip(z,say);const L=await index();
  const pngs=fs.filter(f=>/\.png$/i.test(f.name));const used=new Set();
  for(const f of fs.filter(f=>/\.(glb|gltf)$/i.test(f.name)))last=await add(f.name.replace(/\.(glb|gltf)$/i,''),{kind:'glb',data:await f.arrayBuffer()},L);
  for(const f of fs.filter(f=>/\.json$/i.test(f.name))){const nm=f.name.replace(/(\.geo)?\.json$/i,'');const b=nm.toLowerCase();const png=pngs.find(p=>p.name.toLowerCase().replace(/\.png$/,'')===b)||(pngs.length===1?pngs[0]:null);if(png)used.add(png);
    const txt=await f.text();if(!/"bones"/.test(txt)){say(f.name+' 은 모델 파일이 아니에요');continue}last=await add(nm,{kind:'bed',json:txt,png:png||null},L)}
  for(const f of pngs.filter(p=>!used.has(p))){const u=new Uint8Array(await f.slice(0,32).arrayBuffer());const sz=PNGSZ(u);if(sz&&await isSkin(f,sz[0],sz[1]))last=await add('스킨_'+f.name.replace(/\.png$/i,''),{kind:'skin',png:await normSkin(f,sz[0],sz[1])},L);else last=await add(f.name.replace(/\.png$/i,''),{kind:'spr',png:f},L)}
  await setIndex(L);return last}

// ---------- ☁ 출결 서버(도장 계정)에서 받기 : PC 관리 화면의 [🧸 캐릭터 넣기]로 올린 것 ----------
// 출결 서버 연결 코드(JD1-…): PC 관리 페이지 '캐릭터 넣기' 탭에 나와요
function parseCode(code){code=String(code||'').trim();if(!code.startsWith('JD1-'))return null;try{const raw=atob(code.slice(4).replace(/-/g,'+').replace(/_/g,'/'));const [projectId,apiKey,storageBucket]=raw.split('|');if(!projectId||!apiKey)return null;return{projectId,apiKey,storageBucket,authDomain:projectId+'.firebaseapp.com'}}catch(e){return null}}
function askCfg(){const code=prompt('출결 연결 코드를 넣어 주세요 (JD1- 로 시작 · 출결 PC 관리 → 캐릭터 넣기 탭에 있어요)');const c=parseCode(code);if(c){try{localStorage.setItem('jdpc_cfg',JSON.stringify(c))}catch(e){}}else if(code)alert('연결 코드가 이상해요 (JD1- 로 시작해요)');return c}
function cfgGet(){try{const c=JSON.parse(localStorage.getItem('jdpc_cfg')||'null');if(c&&c.apiKey&&c.projectId)return c}catch(e){}return null}
function cfg(){try{const c=JSON.parse(localStorage.getItem('jdpc_cfg')||'null');if(c&&c.apiKey&&c.projectId)return c}catch(e){}
  const code=prompt('출결 PC 관리의 연결 코드를 넣어 주세요 (JD1- 로 시작)');if(!code)return null;try{const raw=atob(code.trim().slice(4).replace(/-/g,'+').replace(/_/g,'/'));const [projectId,apiKey]=raw.split('|');if(!projectId||!apiKey)return null;const c={projectId,apiKey};localStorage.setItem('jdpc_cfg',JSON.stringify(c));return c}catch(e){return null}}
// 같은 브라우저에서 출결 PC 관리에 로그인해 두었으면 그 로그인을 그대로 써요 (firebase 로그인 저장소)
function fbRT(apiKey){return new Promise(res=>{try{const r=indexedDB.open('firebaseLocalStorageDb');r.onerror=()=>res('');r.onupgradeneeded=()=>{try{r.transaction.abort()}catch(e){}res('')};r.onsuccess=()=>{try{const db=r.result;if(!db.objectStoreNames.contains('firebaseLocalStorage')){res('');return}const q=db.transaction('firebaseLocalStorage','readonly').objectStore('firebaseLocalStorage').getAll();q.onsuccess=()=>{const L=q.result||[];const u=L.find(x=>String(x.fbase_key||'').startsWith('firebase:authUser:'+apiKey))||L.find(x=>String(x.fbase_key||'').startsWith('firebase:authUser:'));const v=u&&(u.value||{});res((v.stsTokenManager&&v.stsTokenManager.refreshToken)||'')};q.onerror=()=>res('')}catch(e){res('')}}}catch(e){res('')}})}
async function token(c,quiet){let rt='';try{rt=localStorage.getItem('zm_cloud_rt')||''}catch(e){}if(!rt){rt=await fbRT(c.apiKey);if(rt)try{localStorage.setItem('zm_cloud_rt',rt)}catch(e){}}
  if(rt){const r=await fetch('https://securetoken.googleapis.com/v1/token?key='+c.apiKey,{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:'grant_type=refresh_token&refresh_token='+encodeURIComponent(rt)});if(r.ok){const j=await r.json();try{localStorage.setItem('zm_cloud_rt',j.refresh_token)}catch(e){}return j.id_token}}
  if(quiet)return null;
  const email=prompt('도장 계정 이메일');if(!email)return null;const pw=prompt('비밀번호 (이 기기에는 저장 안 하고 로그인 표만 저장해요)');if(!pw)return null;
  const r=await fetch('https://identitytoolkit.googleapis.com/v1/accounts:signInWithPassword?key='+c.apiKey,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email,password:pw,returnSecureToken:true})});if(!r.ok)throw new Error('로그인 실패');const j=await r.json();try{localStorage.setItem('zm_cloud_rt',j.refreshToken)}catch(e){}return j.idToken}
async function syncCloud(say,quiet){say=say||(()=>{});const c=quiet?cfgGet():cfg();if(!c){say('연결 코드가 없어요');return null}let tk;try{if(quiet&&!localStorage.getItem('zm_cloud_rt'))return null;tk=await token(c,quiet);if(!tk&&quiet)return null}catch(e){say(e.message);return null}if(!tk){say('취소했어요');return null}
  const H={Authorization:'Bearer '+tk},B='https://firestore.googleapis.com/v1/projects/'+c.projectId+'/databases/(default)/documents/';const L=await index();const have=new Set(L.map(x=>x.cid).filter(Boolean));let page='',list=[];
  do{const r=await fetch(B+'myroomAssets?pageSize=300'+(page?'&pageToken='+page:''),{headers:H});if(!r.ok){say('서버에서 못 받았어요 ('+r.status+')');return null}const j=await r.json();(j.documents||[]).forEach(d=>{try{const a=JSON.parse(d.fields.j.stringValue);a.id=d.name.split('/').pop();list.push(a)}catch(e){}});page=j.nextPageToken||''}while(page);
  const act=new Set(list.filter(a=>a.on!==false).map(a=>a.id));const gone=L.filter(x=>x.cid&&!act.has(x.cid));for(const x of gone)await del(x.n);for(let i=L.length-1;i>=0;i--)if(L[i].cid&&!act.has(L[i].cid))L.splice(i,1);
  {const TM=new Map(list.map(a=>[a.id,a]));L.forEach(x=>{const o=x.cid&&TM.get(x.cid);if(o){if(o.t)x.t=o.t;if(o.pk)x.pk=o.pk}})}   // 미리보기 그림·원래 묶음 이름   // 미리보기 그림(2D 게임 캐릭터로도 씀)
  const TT=new Map(list.map(a=>[a.id,a.t]));
  PK='출결 서버';list=list.filter(a=>act.has(a.id)&&!have.has(a.id)&&(a.type==='skin'||a.fmt==='bed'||a.fmt==='spr'||a.type==='pmd'||a.type==='fxa'));const cnt={bed:0,skin:0,spr:0,pmd:0,fxa:0};let k=0;
  const durl=u=>fetch(u).then(r=>r.blob());
  for(const a of list){try{if(a.type==='skin'){const n=await add('스킨_'+(a.n||a.id),{kind:'skin',png:await durl(a.b),cid:a.id},L,true);L[L.length-1].cid=a.id;L[L.length-1].sk=a.b;cnt.skin++}
      else{const r=await fetch(B+'myroomAssetData/'+encodeURIComponent(a.id),{headers:H});if(!r.ok)continue;const f=(await r.json()).fields||{};const png=f.b?await durl(f.b.stringValue):null;
        if(a.type==='pmd'){const sh={};const SM=(f.s&&f.s.mapValue&&f.s.mapValue.fields)||{};for(const st in SM){try{sh[st]=await durl(SM[st].stringValue)}catch(e){}}if(!sh.idle)continue;await add(a.n||a.id,{kind:'pmd',meta:f.m.stringValue,sheets:sh,cid:a.id},L,true);cnt.pmd++}
        else if(a.type==='fxa'){await add('기술_'+(a.n||a.id),{kind:'fxa',meta:f.m.stringValue,png,cid:a.id},L,true);cnt.fxa++}
        else if(a.fmt==='bed'){await add(a.n||a.id,{kind:'bed',json:f.g.stringValue,png,cid:a.id,anim:f.a?f.a.stringValue:null},L,true);cnt.bed++}else{await add(a.n||a.id,{kind:'spr',png,cid:a.id},L,true);cnt.spr++}L[L.length-1].cid=a.id;if(TT.get(a.id))L[L.length-1].t=TT.get(a.id)}if(a.pk)L[L.length-1].pk=a.pk}catch(e){}
    if(++k%20===0){say('받는 중… '+k+' / '+list.length);await setIndex(L)}}
  await setIndex(L);say('받았어요! 움직이는 포켓몬 '+cnt.pmd+' · 기술 '+cnt.fxa+' · 3D '+cnt.bed+' · 스킨 '+cnt.skin+' · 그림 '+cnt.spr+(list.length?'':' (새로 받을 게 없어요)'));return cnt}

// ---------- 동작 재생 ----------
// 베드락 동작(키프레임 · 몰랑 식) 이 있으면 그대로, 없으면 뼈 이름(다리·팔·머리·꼬리·날개)을 보고 알아서 움직여요
function molang(src){if(typeof src==='number')return()=>src;let e=String(src).toLowerCase().replace(/\s+/g,' ');

  else if(a==='run'){if(BS.trainer){msg('트레이너와의 승부에서는 도망칠 수 없어!').then(menuMain)}else done({t:'run'})}})}

function aiAct(){const me=BS.me.m,f=BS.foe.m;
  if(!BS.trainer&&wantCatch(f)){const S=stOf(f);const ball=G.bag.hyper>0?'hyper':G.bag.great>0?'great':G.bag.ball>0?'ball':null;if(ball){const weak=bestMove(me,f,'weak');const est=dmgCalc(me,f,weak,0).d;if(f.hp/S[0]>.45&&est<f.hp-1&&BS.turn<4)return{t:'move',m:weak};return{t:'item',k:ball}}}
  const S=stOf(me);if(me.hp/S[0]<.25){const p=['hpotion','spotion','potion'].find(k=>G.bag[k]>0);if(p&&BS.healUsed<2){BS.healUsed++;return{t:'item',k:p}}}
  return{t:'move',m:bestMove(me,f)}}

async function sendMe(m,first){const S=await getSpr(m.n);BS.me={m,S,st:'idle',t:0,in:0};bbox();await msg((first?'가랏! ':'돌아와! … 가랏! ')+'<b>'+nm(m)+'</b>!',FAST()?400:800)}

async function battle(o){SCENE='battle';BS.on=1;BS.trainer=o.trainer||null;BS.bg=o.bg||'meadow';BS.turn=0;BS.healUsed=0;BS.fx=[];BS.me=BS.foe=null;showBattleUI(1);sfx('enc');
  await flashIn();const foes=o.foes;let fi=0;await sendFoe(foes[0]);bt('bM').innerHTML='';
  await msg(o.trainer?'<b>'+o.trainer+'</b>(이)가 승부를 걸어왔다!':'앗! 야생 <b>'+nm(foes[0])+'</b>(이)가 나타났다!',FAST()?500:1000);
  if(o.trainer)await msg(o.trainer+'(은)는 <b>'+nm(foes[0])+'</b>(을)를 내보냈다!',FAST()?400:800);
  let me=alive()[0];await sendMe(me,1);const part=new Set([me.uid]);let res='win';
  while(true){BS.turn++;const act=await choose();const f=BS.foe.m;me=BS.me.m;
    if(act.t==='run'){const sp=stOf(me)[5],fs=stOf(f)[5];if(R()<(sp>=fs?1:.55+BS.turn*.1)){await msg('무사히 도망쳤다!');res='run';break}await msg('도망칠 수 없었다!')}
    else if(act.t==='switch'){const m=G.party[act.i];await sendMe(m,0);part.add(m.uid)}
    else if(act.t==='item'){const it=ITEMS[act.k];G.bag[act.k]--;
      if(it.ball){const ok=await throwBall(f,it);if(ok){res='caught';await caught(f);break}}
      else if(it.heal){const S=stOf(me);me.hp=Math.min(S[0],me.hp+it.heal);bbox();sfx('heal');await msg(it.n+'(으)로 '+nm(me)+'의 체력이 회복됐다!')}
      else if(it.lv){await gainLv(me);bbox()}}
    // 내 기술 + 상대 기술 순서
    const fm=BS.trainer?bestMove(f,me):(R()<.35?bestMove(f,me):mv(pick(f.moves)));
    const order=act.t==='move'?((act.m.pri||0)>(fm.pri||0)||((act.m.pri||0)===(fm.pri||0)&&stOf(me)[5]>=stOf(f)[5])?['me','foe']:['foe','me']):['foe'];
    let end=false;for(const who of order){if(who==='me'){if(me.hp<=0)continue;await useMove(me,f,act.m,1)}else{if(f.hp<=0)continue;await useMove(f,me,fm,0)}
      if(f.hp<=0){BS.foe.st='faint';BS.foe.t=0;sfx('faint');await msg((BS.trainer?'상대 ':'야생 ')+'<b>'+nm(f)+'</b>(은)는 쓰러졌다!');BS.foe.hide=1;
        await giveExp(f,part);fi++;if(fi<foes.length){await sendFoe(foes[fi]);await msg(o.trainer+'(은)는 <b>'+nm(foes[fi])+'</b>(을)를 내보냈다!',FAST()?400:800);part.clear();part.add(BS.me.m.uid)}else{end=true}break}
      if(me.hp<=0){BS.me.st='faint';BS.me.t=0;sfx('faint');await msg('<b>'+nm(me)+'</b>(은)는 쓰러졌다!');BS.me.hide=1;const nx=alive();if(!nx.length){res='lose';end=true;break}
        let pick2=nx[0];if(!(AUTO.on||G.autoBattle))pick2=await forcePick();await sendMe(pick2,1);part.add(pick2.uid);break}}
    if(end)break}
  if(res==='win'&&o.trainer){if(o.lose)await msg('<b>'+o.trainer+'</b>: '+o.lose,1400);if(o.money){G.money+=o.money;await msg('상금으로 '+o.money+'원을 받았다!')}}
  if(res==='lose'){await msg('눈앞이 캄캄해졌다…',1500)}
  await evolveCheck();showBattleUI(0);SCENE='over';BS.on=0;await refreshSpr();hud();save();return res}
function forcePick(){return new Promise(r=>{bt('bTx').innerHTML='다음 포켓몬을 고르세요';bt('bMenu').innerHTML=G.party.map((m,i)=>`<button data-p="${i}" ${m.hp<=0?'disabled':''}>${nm(m)} Lv.${m.lv} ${Math.ceil(m.hp)}/${stOf(m)[0]}</button>`).join('');bt('bMenu').querySelectorAll('[data-p]').forEach(x=>x.onclick=()=>r(G.party[+x.dataset.p]))})}
async function throwBall(f,it){await msg('<b>'+it.n+'</b>을(를) 던졌다!',FAST()?300:600);const fp=side(0),mp=side(1);BS.ball={x:mp.x,y:mp.y,col:it.col};
  for(let i=0;i<=20;i++){const u=i/20;BS.ball.x=mp.x+(fp.x-mp.x)*u;BS.ball.y=mp.y-VW*.1+(fp.y-VW*.12-mp.y+VW*.1)*u-Math.sin(u*Math.PI)*VH*.18;BS.ball.rot=u*12;await sleep(18)}
  BS.foe.white=1;await sleep(160);BS.foe.hide=1;BS.foe.white=0;BS.flash=.15;for(let i=0;i<10;i++){BS.ball.y+=VH*.012;await sleep(16)}
  const S=stOf(f),M=META[f.n],b=bst(M.stats);const cr=b>=580?20:Math.max(3,Math.min(255,Math.round(255-(b-180)*.55)));const a=((3*S[0]-2*f.hp)*cr*it.ball)/(3*S[0]);const p=Math.min(1,a/255*(G.dex.c[M.dex]?1:1.2));const sh=Math.pow(p,.25);
  let n=0;for(;n<3;n++){await sleep(380);if(R()>sh)break;for(let k=0;k<8;k++){BS.ball.rot=Math.sin(k/8*6.28)*.5;await sleep(28)}BS.ball.rot=0;sfx('tap')}
  await sleep(300);if(n>=3&&R()<sh){sfx('get');await msg('신난다! <b>'+nm(f)+'</b>(을)를 잡았다!',1300);BS.ball=null;return true}
  BS.ball=null;BS.foe.hide=0;BS.foe.in=.3;await msg(['안 돼! 포켓몬이 볼에서 나와 버렸다!','아쉽다! 조금만 더 하면 잡을 수 있었는데!','으앗! 잡은 줄 알았는데!'][Math.min(2,n)]);return false}
async function caught(f){const M=META[f.n];G.dex.c[M.dex]=1;f.hp=Math.max(1,f.hp);askEvo(M.dex);if(G.party.length<6){G.party.push(f);await msg(nm(f)+'(이)가 동료가 됐다!',900)}else{G.box.push(f);await msg(nm(f)+'(은)는 보관함으로 보내졌다.',900)}
  if(AUTO.hunt&&AUTO.hunt.n===f.n){AUTO.hunt=null;AUTO.huntOnly=0;AUTO.on=G.autoQuest?1:0;toast('🎉 찾던 포켓몬을 잡았어요!')}}
async function giveExp(f,part){const M=META[f.n];const base=Math.round(bst(M.stats)/4.2*f.lv/7*(BS.trainer?1.5:1));for(const m of G.party){if(m.hp<=0)continue;const g=part.has(m.uid)?base:Math.round(base*.5);m.exp+=g;if(m===BS.me.m)await msg('<b>'+nm(m)+'</b>(은)는 경험치 '+g+'을(를) 얻었다!',FAST()?400:800);
  while(m.exp>=expAt(m.lv+1)&&m.lv<100){await gainLv(m,1)}}bbox()}
async function gainLv(m,keep){const S0=stOf(m);m.lv++;if(!keep)m.exp=Math.max(m.exp,expAt(m.lv));const S1=stOf(m);m.hp+=S1[0]-S0[0];m.evoReady=1;sfx('lv');if(BS.on)bbox();
  await msg('<b>'+nm(m)+'</b>(은)는 레벨 <b>'+m.lv+'</b>(으)로 올랐다!',FAST()?450:900);
  for(const [l,id] of learnset(META[m.n]))if(l===m.lv&&!m.moves.includes(id)){const nmv=mv(id);if(m.moves.length<4){m.moves.push(id);await msg(nm(m)+'(은)는 새로 <b>'+nmv.name+'</b>을(를) 배웠다!')}else{const w=m.moves.slice().sort((a,b)=>mv(a).pw-mv(b).pw)[0];if(mv(w).pw<nmv.pw){m.moves[m.moves.indexOf(w)]=id;await msg(nm(m)+'(은)는 '+mv(w).name+'을(를) 잊고 <b>'+nmv.name+'</b>을(를) 배웠다!')}}}}
async function evolveCheck(){for(const m of G.party){if(!m.evoReady)continue;m.evoReady=0;const M=META[m.n];const E=EVC[M.dex];if(!E||!E.length){askEvo(M.dex);continue}
  const opt=E.filter(([d,l])=>m.lv>=l&&BYDEX[d]);if(!opt.length)continue;const [d]=pick(opt);const to=BYDEX[d];
  // 진화 장면
  BS.fx=[];const S0=await getSpr(m.n),S1=await getSpr(to);BS.foe=null;BS.me={m,S:S0,st:'idle',t:0};bt('bF').innerHTML='';bt('bM').innerHTML='';
  await msg('어라…? <b>'+nm(m)+'</b>의 모습이…!',1300);for(let i=0;i<14;i++){BS.me.S=i%2?S1:S0;BS.me.white=1;await sleep(Math.max(60,240-i*14))}BS.me.white=0;BS.me.S=S1;BS.flash=.5;
  const old=nm(m),S0s=stOf(m);m.n=to;askEvo(d);const S1s=stOf(m);m.hp+=S1s[0]-S0s[0];G.dex.s[d]=1;G.dex.c[d]=1;sfx('lv');await msg('축하합니다! <b>'+old+'</b>(은)는 <b>'+nm(m)+'</b>(으)로 진화했다!',1800)}}

// ===== 게임 진행: 건물 · 트레이너 · 체육관 · 리그 · 자동 진행 · 메뉴 · 도감 · 저장 =====
const ITEMS={ball:{n:'몬스터볼',e:'🔴',ball:1,col:'#e83838',p:200},great:{n:'슈퍼볼',e:'🔵',ball:1.5,col:'#3a6ae8',p:600,b:2},hyper:{n:'하이퍼볼',e:'🟡',ball:2.2,col:'#f0c020',p:1200,b:5},
 potion:{n:'상처약',e:'💊',heal:20,p:300},spotion:{n:'좋은상처약',e:'💉',heal:60,p:700,b:3},hpotion:{n:'고급상처약',e:'🧪',heal:150,p:1200,b:6},candy:{n:'이상한사탕',e:'🍬',lv:1}};
function addItem(k,n){G.bag[k]=(G.bag[k]||0)+n}

const DLG={on:0,L:[],r:null,next(){if(!this.on)return;this.L.shift();if(this.L.length){bt('dlg').innerHTML=this.L[0];sfx('tap')}else{this.on=0;bt('dlg').classList.remove('on');const r=this.r;this.r=null;r&&r()}}};

let AC=null;function sfx(k){try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();if(AC.state!=='running')AC.resume();const S={tap:[[880,.04]],get:[[660,.08],[880,.08],[1320,.14]],hit:[[140,.12,'square']],atk:[[420,.06,'triangle']],faint:[[300,.1],[200,.12],[120,.2]],lv:[[523,.08],[659,.08],[784,.08],[1046,.2]],heal:[[600,.1],[800,.1],[1000,.16]],enc:[[200,.06,'square'],[300,.06,'square'],[400,.06,'square'],[600,.12,'square']],badge:[[523,.12],[659,.12],[784,.12],[1046,.3]]}[k]||[[500,.05]];
  let t=AC.currentTime;for(const [f,d,w] of S){const o=AC.createOscillator(),g=AC.createGain();o.type=w||'sine';o.frequency.value=f;g.gain.setValueAtTime(.06,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+d);t+=d*.9}}catch(e){}}

async function enterBld(b){P.busy=1;await fade(.6);await fade(0);P.busy=0;const back=()=>{P.x=b.door.x;P.y=b.door.y+1;P.dir=0;P.trail=[]};
  if(b.kind==='center'||b.kind==='home'){healAll();G.heal={a:G.a,x:b.door.x,y:b.door.y+1};sfx('heal');back();await say([b.kind==='home'?'엄마: 푹 쉬었다 가렴! 포켓몬들이 모두 건강해졌어.':'간호순: 포켓몬들이 모두 건강해졌어요! 또 오세요 ♪']);if(b.kind==='center'){if(AUTO.on)autoBuy();else await shop(1)}save()}

function shop(fromCenter){return new Promise(r=>{const L=shopList();openPanel('🛒 '+(fromCenter?'포켓몬센터 상점':'프렌들리숍')+' · 💰 '+G.money+'원',L.map(k=>`<div class="row"><span>${ITEMS[k].e} <b>${ITEMS[k].n}</b> <small>${ITEMS[k].p}원 · 가진 것 ${G.bag[k]||0}</small></span><span><button data-b="${k}" data-n="1">1개</button><button data-b="${k}" data-n="5">5개</button></span></div>`).join(''),r,p=>{
  p.querySelectorAll('[data-b]').forEach(x=>x.onclick=()=>{const k=x.dataset.b,n=+x.dataset.n,c=ITEMS[k].p*n;if(G.money<c){toast('돈이 모자라요');return}G.money-=c;addItem(k,n);sfx('get');toast(ITEMS[k].n+' ×'+n+' 샀어요');shop0()})});const shop0=()=>{closePanel(1);shop(fromCenter).then(r)}})}
function autoBuy(){const balls=(G.bag.ball||0)+(G.bag.great||0)+(G.bag.hyper||0);const bk=G.badges>=5?'hyper':G.badges>=2?'great':'ball';const pk=G.badges>=6?'hpotion':G.badges>=3?'spotion':'potion';
  let n=0;while(balls+n<10&&G.money-ITEMS[bk].p>=600){G.money-=ITEMS[bk].p;addItem(bk,1);n++}let q=0;while((G.bag[pk]||0)<4&&G.money-ITEMS[pk].p>=600){G.money-=ITEMS[pk].p;addItem(pk,1);q++}if(n||q)toast('🛒 '+(n?ITEMS[bk].n+' ×'+n+' ':'')+(q?ITEMS[pk].n+' ×'+q:'')+' 샀어요')}

function starters(){let L=[[1,4,7],[152,155,158],[252,255,258],[387,390,393],[495,498,501]].map(r=>r.map(d=>BYDEX[d])).find(r=>r.every(Boolean));

function wpick(T){const tot=T.reduce((a,b)=>a+b.w,0);let u=R()*tot;for(const e of T){u-=e.w;if(u<=0)return e.n}return T[0].n}

  const r=await battle({foes:[mkMon(n,ri(lo,hi))],bg:A.th===THEME.town?'meadow':RTH[(G.a-1)/2]});if(r==='lose')await blackout()}

  const r=await battle({trainer:n.name,foes:n.team.map(t=>mkMon(t.n,t.lv)),money:Math.max(...n.team.map(t=>t.lv))*30,lose:pick(['으악, 졌다!','강하구나…!','다음엔 안 질 거야!']),bg:RTH[(G.a-1)/2]});

    p.querySelectorAll('[data-f]').forEach(x=>x.onclick=()=>dexOpen(x.dataset.f));p.querySelectorAll('[data-n]').forEach(x=>x.onclick=()=>dexOne(decodeURIComponent(x.dataset.n)))})}
function dexOne(n){const M=META[n],cc=G.dex.c[M.dex],L=LOC[n]||[];const evFrom=SPECIES.find(s=>(EVC[META[s].dex]||[]).some(e=>e[0]===M.dex));
  openPanel('📖 No.'+M.dex+' '+M.name,`<div class="d1"><img src="${THUMB[n]||''}"><div><div>${M.types.map(t=>`<em style="background:${TCOL[t]}">${TN[t]}</em>`).join(' ')}</div><small>체력 ${M.stats[0]} · 공격 ${M.stats[1]} · 방어 ${M.stats[2]} · 특공 ${M.stats[3]} · 특방 ${M.stats[4]} · 스피드 ${M.stats[5]}</small><div>${cc?'✅ 잡았어요':'❌ 아직 못 잡았어요'}</div><small>기술: ${(M.moves||[]).map(m=>m.name).join(', ')||'-'}</small></div></div>
  <h4>나오는 곳</h4>${L.length?L.map(a=>`<div class="row"><span>🌿 ${areaName(a)} <small>(Lv.${areaLv(a).join('~')}${genArea(a).enc.w.some(e=>e.n===n)&&!genArea(a).enc.g.some(e=>e.n===n)?' · 물 위':''})</small></span><button data-go="${a}">🧭 찾으러 가기</button></div>`).join(''):`<small>${evFrom?META[evFrom].name+'(을)를 키워서 진화시키면 얻을 수 있어요':'풀숲에서는 안 나와요 (진화로 얻거나 다른 세이브에서 나와요)'}</small>`}`,()=>dexOpen(),p=>{
    p.querySelectorAll('[data-go]').forEach(x=>x.onclick=()=>{const a=+x.dataset.go;if(!G.party.length){toast('먼저 첫 포켓몬을 받아요');return}if(a>2*G.badges+1){toast('아직 배지가 모자라서 갈 수 없어요 (배지 '+((a-1)/2)+'개 필요)');return}AUTO.hunt={a,n};AUTO.on=1;AUTO.huntOnly=1;closePanel(1);toast('🧭 '+M.name+' 찾으러 '+areaName(a)+'(으)로 출발!');hud()})})}
function buildLoc(){LOC={};for(let a=1;a<18;a+=2){const T=encTable(a);for(const e of T.g.concat(T.w)){(LOC[e.n]=LOC[e.n]||[]);if(!LOC[e.n].includes(a))LOC[e.n].push(a)}}}
// ---------- 저장 ----------
function save(){if(!G)return;G.x=P.x;G.y=P.y;G.dir=P.dir;G.t=Date.now();LS.set('pka-save',G)}
function newGame(){G={v:1,seed:ri(1,1e8),a:0,x:10,y:12,dir:3,party:[],box:[],bag:{},money:3000,badges:0,dex:{s:{},c:{}},beat:{},got:{},visit:{0:1},heal:{a:0,x:4,y:15},flags:{},opt:{catchNew:true},fast:0,autoBattle:0}}

// ===== 시작 화면 · 포켓몬 불러오기 · 반복 =====
async function loadPool(prog){const L=(await UP.index()).filter(x=>x.k==='pmd');const C=LS.get('pka-meta',{});let dirty=0,i=0;META={};THUMB={};
  for(const x of L){i++;if(i%20===0){prog&&prog(i,L.length);await sleep(0)}THUMB[x.n]=x.t||'';let m=C[x.n];if(!m){try{const r=await UP.get(x.n);const j=typeof r.meta==='string'?JSON.parse(r.meta):r.meta;m={dex:j.dex|0,name:j.name||x.n,types:(j.types&&j.types.length?j.types:['NORMAL']).map(t=>String(t).toUpperCase()),stats:j.stats&&j.stats.length===6?j.stats:[50,50,50,50,50,50],moves:(j.moves||[]).slice(0,4).map(q=>({id:String(q.id||'').toLowerCase(),name:q.name,type:String(q.type||'NORMAL').toUpperCase()})),anim:!!(j.anims&&j.anims.walk)};C[x.n]=m;dirty=1}catch(e){continue}}
    if(!m.anim)continue;META[x.n]=m}
  if(dirty)LS.set('pka-meta',C);BYDEX={};for(const n in META){const d=META[n].dex;if(!d)continue;if(!BYDEX[d]||/shiny|_\d+$/i.test(BYDEX[d]))BYDEX[d]=n}SPECIES=Object.values(BYDEX).sort((a,b)=>META[a].dex-META[b].dex);
  for(const n of SPECIES)for(const q of META[n].moves)if(q.id)mvOf(q);try{FXA=await UP.fxaAll()||{}}catch(e){FXA={}}return SPECIES.length}
async function title(){SCENE='title';bt('title').classList.add('on');const T=bt('tInfo');T.textContent='포켓몬 불러오는 중…';let n=0;
  try{await Promise.race([UP.autoSync(),sleep(6000)])}catch(e){}
  try{n=await loadPool((i,N)=>T.textContent='포켓몬 불러오는 중… '+Math.round(i/N*100)+'%')}catch(e){T.textContent='불러오기 실패: '+e.message}
  const sv=LS.get('pka-save',null);bt('tCont').style.display=sv&&n>=10?'':'none';bt('tNew').disabled=n<10;
  T.innerHTML=n>=10?`움직이는 포켓몬 <b>${n}</b>마리 준비 완료!`+(sv?`<br><small>이어하기: ${areaName(sv.a)} · 배지 ${sv.badges} · 도감 ${Object.keys(sv.dex.c).length}</small>`:''):`움직이는 포켓몬이 ${n}마리뿐이에요 (10마리 이상 필요)<br><small>아래 「☁ 받기」(출결 PC에 올린 포켓몬) 또는 「📦 ZIP 넣기」(레조넌스 팩)를 눌러 주세요</small>`}
function start(sv){G=sv||null;if(!G)newGame();G.opt=G.opt||{catchNew:true};G.flags=G.flags||{};G.party=(G.party||[]).filter(m=>META[m.n]);G.box=(G.box||[]).filter(m=>META[m.n]);G.got=G.got||{};G.beat=G.beat||{};
  if(G.party.length===0&&G.box.length)G.party.push(G.box.shift());if(G.rival&&!META[G.rival.n])G.rival={n:pick(SPECIES)};
  for(const k in AREAS)delete AREAS[k];buildLoc();for(const m of G.party)askEvo(META[m.n].dex);
  bt('title').classList.remove('on');SCENE='over';place(G.a,G.x,G.y,G.dir);refreshSpr();hud();
  if(!sv)say(['포켓몬 어드벤처에 온 걸 환영해요!','이곳은 새싹마을. 먼저 오른쪽 아래 <b>연구소</b>에서 첫 포켓몬을 받아요.','화면 위 「▶ 자동」을 누르면 다음 할 일을 알아서 진행해요. 방향 버튼을 누르면 직접 움직여요!'])}
bt('tCont').onclick=()=>{sfx('tap');start(LS.get('pka-save',null))};
bt('tNew').onclick=()=>{sfx('tap');if(LS.get('pka-save',null)&&!confirm('처음부터 시작할까요? 지금 저장은 지워져요.'))return;start(null)};
bt('tSync').onclick=async()=>{const T=bt('tInfo');T.textContent='☁ 출결 서버에서 받는 중…';try{await UP.autoSync(true)}catch(e){T.textContent='받기 실패: '+e.message;return}title()};
bt('tZip').onchange=async e=>{const fs=[...e.target.files];if(!fs.length)return;const T=bt('tInfo');try{await UP.importFiles(fs,t=>T.textContent=t)}catch(err){T.textContent='넣기 실패: '+err.message;return}LS.set('pka-meta',{});title()};
// 방향 버튼
document.querySelectorAll('#pad [data-d]').forEach(b=>{const d=+b.dataset.d;const on=e=>{e.preventDefault();KEY.dir=d;userMove();b.classList.add('on')},off=e=>{if(KEY.dir===d)KEY.dir=-1;b.classList.remove('on')};b.addEventListener('pointerdown',on);b.addEventListener('pointerup',off);b.addEventListener('pointerleave',off);b.addEventListener('pointercancel',off)});
bt('bA').addEventListener('pointerdown',e=>{e.preventDefault();onA()});
// 이벤트: 지역에 처음 들어가면
let LASTA=-1,DLGT=0;function loop(t){const dt=Math.min(.05,(t-LAST)/1000);LAST=t;NOW+=dt;if(DLG.on&&AUTO.on){DLGT+=dt;if(DLGT>(G&&G.fast?.6:1.1)){DLGT=0;DLG.next()}}else DLGT=0;
  if(SCENE==='over'&&G){updOver(dt);drawOver(dt);if(G.a!==LASTA&&!P.busy&&!P.mv&&!DLG.on){LASTA=G.a;areaEvent()}}
  else if(SCENE==='battle')drawBattle(dt);else{cx.fillStyle='#1a2a4a';cx.fillRect(0,0,cv.width,cv.height)}
  requestAnimationFrame(loop)}
requestAnimationFrame(loop);title();
setInterval(()=>{if(SCENE==='over'&&G)save()},15000);
new MutationObserver(()=>{requestAnimationFrame(()=>document.body.style.setProperty('--mh2',(bt('bMenu').offsetHeight+16)+'px'))}).observe(bt('bMenu'),{childList:true});
</script>
</body></html>
